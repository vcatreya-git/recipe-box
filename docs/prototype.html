   DISH_TILES, cookTimeBucket, dishFacets, mergeFacets, computeTapGroup, tasteReadoutHTML, shuffle). Deliberately
   left out of this file's numbered section sequence (unlike every other section) so inserting it doesn't force
   renumbering every section below it — same "flag, don't renumber" precedent as 00-Handoff.md's existing
   delta-pass-numbering note.

   Ported mechanism (see 00-Handoff.md for the full dated entry): free-floating nodes drift under a soft
   pairwise-repulsion + jitter + damping physics loop (tickDishGraph — requestAnimationFrame, cancelled on
   close), with NO rendered connections/edges ever. Tapping one node fades out + removes every currently
   on-screen node sharing its `family` simultaneously (tapDishNode), silently also absorbs facet signal from
   same-family dishes never shown on screen this session (computeTapGroup reads the full DISH_TILES list, not
   just what's currently rendered), then refills toward a diverse target count from families not yet
   represented (refillDishBoard). Reusable from both onboarding and Profile & Settings via openTasteGraph(mode).
   ============================================================ */
const DG_TARGET_COUNT = 13;     // steady-state node count the board seeds/refills toward (12-14 range)
const DG_SEED_FAMILIES = 6;     // distinct families sampled for the initial seed board

function openTasteGraph(mode){
  const dg = state.tasteGraph;
  if(dg.raf){ cancelAnimationFrame(dg.raf); dg.raf = null; }
  /* Onboarding back-nav fix (2026-08-16) — RESUME, don't always reset. Retune (Profile & Settings) still always
     resets fresh on every open — that IS the explicit "clear it and rerun" mechanism, unchanged. But onboarding
     now has a Back button (backFromTasteGraph(), below) that leaves this session's dg state completely alone
     while hiding the overlay, so a user who backs out to Slots/Profile and returns here (whether directly, or
     after going back further still and re-advancing) must RESUME the same board/signal, not get a fresh reseed
     that silently drops already-tapped dishes. A session is "resumable" if it was already started this
     onboarding pass (dg.mode==='onboarding') and has either live nodes on the board or already-registered taps
     (taps>0 covers the rare edge case where the whole pantry was exhausted — dg.nodes is empty but real signal
     was captured). A brand-new onboarding pass (dg.mode still null, or left over from a prior 'retune') always
     seeds fresh, exactly as before. */
  const resuming = mode==='onboarding' && dg.mode==='onboarding' && (dg.nodes.length>0 || dg.taps>0);
  if(!resuming){
    dg.mode = mode;
    dg.unused = new Set(DISH_TILES.map(d=>d.id));
    dg.nodes = [];
    dg.signal = emptySignal();
    dg.taps = 0;
    dg.locking = false;
    dg.familyPicked = {};    // Fix 1 — per-family Set of weak/neutral-picked dish ids, reset fresh every open
    dg.pickedWeight = {};    // Fix 1 — {dishId: weight} for pending (not-yet-resolved) picks
    $('tasteCanvas').innerHTML = '';
  }
  $('tasteLayer').classList.add('on');
  /* Fix 2 — the taste graph is now also used as onboarding's dedicated final step (mode==='onboarding'), which
     needs its own step-indicator dots and a "Continue" (not "Done") CTA that's gated on ONBOARD_TASTE_MIN_TAPS.
     Profile & Settings' "Retune" entry point (mode==='retune') is untouched — no dots, plain "Done", no gate. */
  const stepsEl = $('tasteBarSteps');
  const doneBtn = $('tasteBarDone');
  const backBtn = $('tasteBarBack');
  if(mode==='onboarding'){
    stepsEl.innerHTML = onboardStepDots(3);
    stepsEl.classList.remove('hidden');
    backBtn.innerHTML = ico('back');
    backBtn.classList.remove('hidden');
  } else {
    stepsEl.innerHTML = '';
    stepsEl.classList.add('hidden');
    backBtn.classList.add('hidden');
  }
  updateTasteContinue();
  updateDishReadout();
  if(!resuming) seedDishBoard();
  dg.raf = requestAnimationFrame(tickDishGraph);
}
/* Onboarding back-nav fix (2026-08-16) — the taste step's own Back affordance (see the #tasteBarBack button in
   the static overlay markup). Deliberately does NOT reset or commit the session: cancels the physics loop and
   hides the overlay only, leaving state.tasteGraph exactly as it was (nodes, unused, signal, taps, familyPicked,
   pickedWeight all untouched) so the very next openTasteGraph('onboarding') call — whether the user comes
   straight back or goes back further still (Slots/Profile/Intent) and re-advances — resumes this same session
   rather than restarting it. Signal is only ever committed to Profile at real completion (closeTasteGraph()'s
   Continue path), never here — going back is explicitly not "done." */
function backFromTasteGraph(){
  const dg = state.tasteGraph;
  if(dg.raf){ cancelAnimationFrame(dg.raf); dg.raf = null; }
  $('tasteLayer').classList.remove('on');

function closeTasteGraph(){

  if(dg.mode==='onboarding' && dg.taps < ONBOARD_TASTE_MIN_TAPS){

/* Writes the session's accumulated signal onto Profile — a full replace, not a merge with whatever was there
   before (per the task's "clear it and rerun" requirement). cuisinesLiked is the one locked Profile field this
   writes into; tasteSignals is the additive soft-signal snapshot (see the state.profile.tasteSignals comment
   for why it's not a locked field). Both Browse's taste toggle and This Week's explore-intent sort read
   state.profile.cuisinesLiked live at render time, so no further plumbing is needed for either to pick this up. */
function applyTasteSignalToProfile(){
  const dg = state.tasteGraph;
  state.profile.cuisinesLiked = new Set(Object.keys(dg.signal.cuisine));
  state.profile.tasteSignals = Object.assign({}, dg.signal, {taps: dg.taps});
}
function seedDishBoard(){
  const canvas = $('tasteCanvas');
  const W = canvas.clientWidth || 380;
  const H = canvas.clientHeight || 460;
  const dg = state.tasteGraph;
  const byFam = {};
  DISH_TILES.filter(d=>dg.unused.has(d.id)).forEach(d=>{ (byFam[d.family]=byFam[d.family]||[]).push(d); });
  // Prefer families with >=2 members for the seed sample — several families in this dataset are deliberate
  // singletons (dal, flatbread, dessert, egg-dish, grilled — see the DISH_TILES header comment), and sampling
  // too many of those on the very first board would undershoot the ~12-14-node target. Falls back to thin
  // (1-member) families only if there aren't enough richer ones to fill DG_SEED_FAMILIES.
  const famNames = Object.keys(byFam);
  const rich = shuffle(famNames.filter(f=>byFam[f].length>=2));
  const thin = shuffle(famNames.filter(f=>byFam[f].length<2));
  const famKeys = rich.concat(thin).slice(0, DG_SEED_FAMILIES);
  const incoming = [];
  famKeys.forEach(fam=>{
    shuffle(byFam[fam]).slice(0, 2 + (incoming.length%2)).forEach(d=>incoming.push(d));
  });
  shuffle(incoming).forEach(d=>placeDishNode(d, W, H, true));
}
function refillDishBoard(){
  const canvas = $('tasteCanvas');
  const W = canvas.clientWidth || 380;
  const H = canvas.clientHeight || 460;
  const dg = state.tasteGraph;
  const need = Math.max(0, DG_TARGET_COUNT - dg.nodes.length);
  if(!need) return;
  const onBoardIds = new Set(dg.nodes.map(n=>n.dish.id));
  const onBoardFamilies = new Set(dg.nodes.map(n=>n.dish.family));
  const sig = dg.signal;
  const saturated = d => (sig.cuisine[d.cuisine]||0)>=3 && (d.ingredientTags||[]).every(i => !i || (sig.ingredient[i]||0)>=3);
  const pool = shuffle(DISH_TILES.filter(d=>dg.unused.has(d.id) && !onBoardIds.has(d.id) && !saturated(d)));
  if(!pool.length) return;
  // Prefer unknown axes — don't refill with more of a strong cuisine/ingredient.
  const picked = [];
  const seenFam = new Set(onBoardFamilies);
  pool.forEach(d=>{
    if(picked.length>=need || seenFam.has(d.family)) return;
    picked.push(d); seenFam.add(d.family);
  });
  if(picked.length<need){
    pool.forEach(d=>{ if(picked.length<need && !picked.includes(d)) picked.push(d); });
  }
  picked.forEach(d=>placeDishNode(d, W, H, false));
}
function placeDishNode(dish, W, H, initial){
  const dg = state.tasteGraph;
  const pad = 46;
  let x, y, tries = 0;
  do{
    x = pad + Math.random()*(W-pad*2);
    y = pad + Math.random()*(H-pad*2);
    tries++;
  } while(tries<20 && dg.nodes.some(n=>(n.x-x)**2 + (n.y-y)**2 < 78*78));
  const node = { dish, x, y, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, el:null };
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'tnode' + (initial ? '' : ' in');
  el.style.left = x+'px'; el.style.top = y+'px';
  const [bg,fg] = tint(dish.cuisine);
  const letter = dish.name.replace(/^The /i,'').charAt(0);
  el.innerHTML = '<span class="orb" style="'+(dish.img?'':'background:'+bg+';color:'+fg)+'">'+
    (dish.img ? '<img src="'+dish.img+'" alt="">' : esc(letter)) + '</span>'+
    '<span class="lbl">'+esc(dish.name)+'</span>';
  el.addEventListener('click', ()=>tapDishNode(dish.id));
  $('tasteCanvas').appendChild(el);
  node.el = el;
  dg.nodes.push(node);
}
/* Tap → tiered response (Fix 1 — see the TASTE_SIGNAL_* constants block above `computeTapTier()` for the full
   scheme). Only a STRONG resolution fades/removes/refills the board; WEAK and NEUTRAL just toggle a dish's
   "picked" visual state and register its (lighter-weighted) facet signal — no pruning, no refill, every other
   dish stays exactly where it is. Re-tapping an already-picked (weak/neutral) dish is a clean deselect: un-picks
   it and reverses exactly the weight it had contributed (a documented choice — see 00-Handoff.md; a no-op would
   have been simpler but a deselect gives the user an explicit way to walk back a premature tap, and the
   pickedWeight bookkeeping needed to make it exact was small). `dg.taps` still increments on every tap this
   function processes, including deselects — unchanged from before this pass, per the task's explicit
   instruction not to touch the existing Continue-gate counting contract. DOM removal on a STRONG resolution is
   still deferred 430ms behind the CSS opacity+scale transition (see .tnode.gone), exactly as before. */
function tapDishNode(id){
  const dg = state.tasteGraph;
  if(dg.locking) return;
  if(!dg.unused.has(id)) return;
  const dish = DISH_TILES.find(d=>d.id===id);
  if(!dish) return;
  dg.taps++;
  const fam = dish.family;
  const pickedSet = dg.familyPicked[fam] || (dg.familyPicked[fam] = new Set());
  const onBoardCount = dg.nodes.filter(n=>n.dish.family===fam).length;
  const decision = computeTapTier(id, pickedSet, onBoardCount);

  if(decision.tier === 'deselect'){
    pickedSet.delete(id);
    const w = dg.pickedWeight[id];
    delete dg.pickedWeight[id];
    if(w) mergeFacets(dg.signal, [dish], -w);
    const node = dg.nodes.find(n=>n.dish.id===id);
    if(node && node.el) node.el.classList.remove('picked');
    updateDishReadout();
    return;
  }

  pickedSet.add(id);

  if(decision.tier === 'strong'){
    dg.locking = true;
    const group = computeTapGroup(id, dg.unused);
    mergeFacets(dg.signal, group, decision.weight);
    const groupIds = new Set(group.map(d=>d.id));
    groupIds.forEach(gid=>{ dg.unused.delete(gid); delete dg.pickedWeight[gid]; });
    delete dg.familyPicked[fam];
    const doomed = dg.nodes.filter(n=>groupIds.has(n.dish.id));
    doomed.forEach(n=>{ if(n.el) n.el.classList.add('gone'); });
    updateDishReadout();
    setTimeout(()=>{
      doomed.forEach(n=>{ if(n.el && n.el.parentNode) n.el.parentNode.removeChild(n.el); });
      dg.nodes = dg.nodes.filter(n=>!groupIds.has(n.dish.id));
      refillDishBoard();
      dg.locking = false;
      if(dg.unused.size===0) toast("That's the whole pantry — Done when you're ready.");
    }, 430);
  } else {
    // weak or neutral — mark picked, register the tapped dish's own facets at this tier's weight, no
    // pruning/removal/refill; every other dish on the board (including siblings in the same family) stays put.
    dg.pickedWeight[id] = decision.weight;
    mergeFacets(dg.signal, [dish], decision.weight);
    const node = dg.nodes.find(n=>n.dish.id===id);
    if(node && node.el) node.el.classList.add('picked');
    updateDishReadout();
  }
}
function updateDishReadout(){
  const el = $('tasteReadout');
  const dg = state.tasteGraph;
  if(el) el.innerHTML = tasteReadoutHTML(Object.assign({}, dg.signal, {taps: dg.taps}));
  updateTasteContinue();
}
function updateTasteContinue(){
  const btn = $('tasteBarDone');
  if(!btn) return;
  const dg = state.tasteGraph;
  if(dg.mode!=='onboarding'){
    btn.disabled = false;
    btn.className = 'btn ghost sm';
    btn.textContent = 'Done';
    return;
  }
  const need = ONBOARD_TASTE_MIN_TAPS;
  const have = dg.taps||0;
  const ready = have >= need;
  btn.disabled = !ready;
  btn.className = ready ? 'btn sm' : 'btn ghost sm';
  btn.textContent = 'Continue';
}
/* rAF physics loop — soft mutual repulsion below 78px, small constant random jitter, velocity damping, edge
   bounce. No rendered connections/edges — this loop alone is the entire "graph" feel. Cancelled on close. */
function tickDishGraph(){
  const canvas = $('tasteCanvas');
  const dg = state.tasteGraph;
  if(!canvas || !$('tasteLayer').classList.contains('on')){ dg.raf = null; return; }
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const nodes = dg.nodes;
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a = nodes[i], b = nodes[j];
      let dx = a.x-b.x, dy = a.y-b.y;
      let d2 = dx*dx + dy*dy;
      if(d2 < 1) d2 = 1;
      if(d2 < 78*78){
        const d = Math.sqrt(d2);
        const f = (78-d) / d * 0.04;
        a.vx += dx*f; a.vy += dy*f;
        b.vx -= dx*f; b.vy -= dy*f;
      }
    }
  }
  nodes.forEach(n=>{
    n.vx += (Math.random()-.5)*0.04;
    n.vy += (Math.random()-.5)*0.04;
    n.vx *= 0.96; n.vy *= 0.96;
    n.x += n.vx; n.y += n.vy;
    const pad = 42;
    if(n.x < pad){ n.x = pad; n.vx *= -1; }
    if(n.x > W-pad){ n.x = W-pad; n.vx *= -1; }
    if(n.y < pad){ n.y = pad; n.vy *= -1; }
    if(n.y > H-pad){ n.y = H-pad; n.vy *= -1; }
    if(n.el){ n.el.style.left = n.x+'px'; n.el.style.top = n.y+'px'; }
  });
  dg.raf = requestAnimationFrame(tickDishGraph);
}

function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function normalizeFacetToken(s){ return String(s||'').trim().replace(/\s+/g,' '); }
function looksLikeFacetList(s){
  const t = normalizeFacetToken(s);
  return /[,;/|]/.test(t) || /\s+(&|and|or)\s+/i.test(t);
}
function isPantryStaple(name){
  const n = String(name||'').toLowerCase();
  return /^(salt|water|ice water|oil|ghee|butter|olive oil|coconut oil|gingelly oil|groundnut oil)$/.test(n)
    || /^(turmeric|asafoetida|black pepper)$/.test(n);
}
function boxCuisineSuggestions(){
  const present = new Set(state.box.map(r=>r.cuisine).filter(Boolean));
  const fromBox = [];
  CUISINE_TREE.forEach(t=>{
    if(present.has(t.name)) fromBox.push(t.name);
    t.children.forEach(c=>{ if(present.has(c)) fromBox.push(c); });
  });
  if(fromBox.length) return fromBox;
  return CUISINE_TREE.map(t=>t.name);
}
function boxTagSuggestions(){
  const counts = {quick:0};
  state.box.forEach(r=>(r.tags||[]).forEach(t=>{
    const k = String(t||'').toLowerCase();
    if(k) counts[k] = (counts[k]||0)+1;
  }));
  return Object.keys(counts).sort((a,b)=>(counts[b]-counts[a])||a.localeCompare(b)).slice(0,12);
}
function boxIngredientSuggestions(){
  const counts = {};
  state.box.forEach(r=>names(r).forEach(n=>{
    const k = String(n||'').toLowerCase().trim();
    if(!k || isPantryStaple(k)) return;
    counts[k] = (counts[k]||0)+1;
  }));
  return Object.keys(counts).sort((a,b)=>(counts[b]-counts[a])||a.localeCompare(b)).slice(0,12);
}

function addNamedBucket(kind, type, value){
  kind = kind==='week' ? 'week' : 'standing';
  value = normalizeFacetToken(value);
  if(!value){ toast('Pick or type one '+type+' first.'); return; }
  if(looksLikeFacetList(value)){
    toast('One value per seat. Add basil and thyme as two seats.');
    return;
  }
  if(type==='collection'){ toast('Pick one of your collections.'); return; }
  if(type==='surprise'){ addSurpriseSeat(kind); return; }
  const bag = slotBag(kind);
  const existing = bag.find(b=>b.facetType===type && (b.facetValue||'').toLowerCase()===value.toLowerCase());
  if(existing) existing.count++;
  else bag.push({id:'sl'+Date.now(), facetType:type, facetValue:value, count:1});
  rerender();
  toast('Added '+value+' to '+(kind==='week'?'this week':'your usual week')+'.');
}
function addCollectionBucket(kind, collectionId){
  kind = kind==='week' ? 'week' : 'standing';
  const col = state.collections.find(c=>c.id===collectionId);
  if(!col){ toast('That collection is gone.'); return; }
  const bag = slotBag(kind);
  const existing = bag.find(b=>b.facetType==='collection' && (b.collectionId===col.id || (b.facetValue||'').toLowerCase()===col.name.toLowerCase()));
  if(existing) existing.count++;
  else bag.push({id:'sl'+Date.now(), facetType:'collection', facetValue:col.name, collectionId:col.id, count:1});
  rerender();
  toast('Added '+col.name+' — Generate looks in that collection.');
}
function addSurpriseSeat(kind){

function suggestSlotsFromLikes(kind){
  kind = kind==='week' ? 'week' : 'standing';
  const liked = [...state.profile.cuisinesLiked];
  const cooked = {};
  state.box.forEach(r=>{ if(state.cookLog.some(c=>c.recipeId===r.id)) cooked[r.cuisine]=(cooked[r.cuisine]||0)+1; });
  const ranked = liked.length ? liked : Object.keys(cooked);
  const use = (ranked.length ? ranked : ['South Indian','North Indian']).slice(0,4);
  const total = Math.max(use.length, slotBag(kind).reduce((s,b)=>s+b.count,0) || use.length);
  const base = Math.floor(total/use.length); let rem = total%use.length;
  const next = use.map(v=>({id:'sl'+Math.random(), facetType:'cuisine', facetValue:v, count: base + (rem-- > 0 ? 1:0)}));
  if(kind==='week') state.weekSlots = next;
  else state.slots = next;
  rerender();
  toast((kind==='week'?'This week':'Usual week')+' reset from what you like and have cooked.');
}

function resolveCookRitual(dayIndex, response){

  if(d.ritual===response){ d.ritual=null; rerender(); return; }
  d.ritual = response;

function beginAdoptDraft(opts){

  const item = {
    id: 'ib'+Date.now(),
    method: opts.kind,
    status: 'ready',
    draft: recipeToDraft(r),
    adopt: {kind: opts.kind, sourceId: r.id, shareId: opts.shareId||null, label: opts.label},
    origSnapshot: {ingredients: (r.ingredients||[]).map(i=>({item:i.item,amount:i.amount})), steps:(r.steps||[]).slice()}
  };
  state.inbox.unshift(item);

function startCapture(method){
  if(state.blocked && method!=='manual'){
    toast('Capture is paused on this account. You can still cook from your recipes.');
    return;
  }
  const billable = method==='link' || method==='screenshot';
  if(billable && state.captureCount >= state.captureLimit){
    toast((state.captureLimit)+' of '+state.captureLimit+' extracts this hour. Try again at :40 — or type a name now, no extract.');
    return;
  }
  const id = 'ib'+Date.now();
  const item = {id, method, status:'extracting', draft:null, visChoice:'global'};
  state.inbox.unshift(item);
  showScreen('scr-inbox');
  if(method==='manual'){
    item.status='manual';
    item.draft = {title:'', dishName:'', creatorName:'', cuisine:null, mins:30, effort:'easy', servings:4, image:null, hasImage:false,
      ingredients:[], steps:[], sources:[], note:'', dietTags:[], needsCare:false, confidenceReason:null};
    rerender();
    return;
  }
  state.captureCount++;
  setTimeout(()=>{
    const s = EXTRACTION_SAMPLES[method];
    const low = method==='screenshot';
    const fromClip = creatorFromUrl(state.clipboardUrl||s.sourceUrl||'');
    item.status='ready';
    item.draft = {title:s.title, dishName:s.dishName||suggestDishName(s.title), creatorName: fromClip||s.creatorName||'',
      cuisine:s.cuisine, mins:s.mins, effort:s.effort, servings:s.servings||4, image:s.image, hasImage:s.hasImage,
      ingredients:s.ingredients.map(i=>({item:i.item, amount:i.amount})), steps:s.steps.slice(),
      sources: s.sourceUrl ? [{url:s.sourceUrl, note:''}] : [], note:'', dietTags:[],
      needsCare: low, confidenceReason: low ? 'no_method' : null};
    item.origSnapshot = {ingredients: item.draft.ingredients.map(i=>({item:i.item,amount:i.amount})), steps:item.draft.steps.slice()};
    if(state.screen==='scr-inbox') rerender();
    toast('Extracted "'+s.title+'" — ready to review.');
  }, 900);
}

    ? ' is in Browse and in your recipes.'
    : ' is in your recipes as a personal version of '+rec.dishName)+
    (sibs?' · '+sibs+' other '+(sibs===1?'version':'versions')+' already exist.':''));
  showScreen('scr-box');
}

/* Quiet by default (this pass) — Private is the default state and needs no badge announcing it; only

function visTag(r){

  if(r.visibility==='global') return '<span class="tag vis-global">'+ico('globe')+' Global</span>';
  if(r.visibility==='shared') return '<span class="tag vis-shared">'+ico('people')+' Shared</span>';

/* ---- 3-up grid card — shared by Box (Recently Added, cuisine groups, Collections) and Station (browse/search) ----
   Box cards show a meta line of cuisine + time (no fabricated rating — Box recipes are the owner's own, there is
   no caller-facing "rating" for them). Station cards show a rating line (like_count / has_liked) plus a secondary
   "by {owner} · {mins} min" line, since Station is the global catalogue where popularity is real signal. */
function visIconBadge(r){
  if(!ownedByYou(r.id) || r.visibility==='private') return '';
  const cls = r.visibility==='global' ? 'global' : 'shared';
  const icon = r.visibility==='global' ? 'globe' : 'people';
  return '<span class="vbadge '+cls+'">'+ico(icon)+'</span>';
}
function vcard(r, opts){
  opts = opts||{};
  const sel = opts.selectable && state.selectMode;
  const isOn = state.selectedIds.has(r.id);
  const onclick = sel ? "toggleBoxSelected('"+r.id+"')" : (opts.onclick ? opts.onclick(r.id) : "openRecipe('"+r.id+"','"+(opts.origin||'scr-box')+"')");
  const badge = sel
    ? '<div class="selchk '+(isOn?'on':'')+'">'+(isOn?ico('check'):'')+'</div>'
    : visIconBadge(r);
  /* dishGrouped (Solution-Sketch delta #10) — on dish-grouped search cards specifically, creator_name is the
     distinguishing subtitle (e.g. "Pav Bhaji — 2 versions" as the group header, "Sanjyot Kher" vs. "Ranveer
     Brar" as each version's own subtitle) rather than the generic "by {owner}" every other station card shows —
     owner is the Recipe Box account that captured it, not necessarily the real-world creator being surfaced
     here. Falls back to owner when creatorName is null (a capture with no identifiable creator), same fallback
     shape as every other creatorName display in this file. */
  const already = myBoxCopyOf(r.id);
  const owned = ownedCopyOf(r.id);
  const inCol = !!(owned && recipeInAnyCollection(owned.id));
  const selecting = !!(opts.selectable && state.selectMode);
  const showLike = opts.stationMeta || r.visibility==='global';
  const heart = showLike ? '<div class="likeline '+(hasLiked(r.id)?'on':'')+'" onclick="event.stopPropagation();toggleLikeRecipe(\''+r.id+'\')">'+ico('heart')+(opts.stationMeta?' '+r.likeCount:'')+'</div>' : '';
  const add = opts.stationMeta
    ? '<div class="addline '+(already?'on':'')+'" title="'+(already?'Already in your recipes':'Add to my recipes')+'" onclick="event.stopPropagation();quickAddToRecipes(\''+r.id+'\')">'+ico(already?'check':'plus')+'</div>'
    : '';
  const globe = (!opts.stationMeta && !selecting && canPublishToBrowse(r))
    ? '<div class="globeline" title="Publish to Browse" onclick="event.stopPropagation();publishRecipeGlobal(\''+r.id+'\')">'+ico('globe')+'</div>'
    : '';
  const col = selecting ? '' : '<div class="colline '+(inCol?'on':'')+'" title="Add to collection" onclick="event.stopPropagation();quickAddToCollection(\''+(owned?owned.id:r.id)+'\')">'+ico('book')+'</div>';
  const metaLine = opts.stationMeta
    ? '<div class="actrow">'+heart+add+col+'</div><p class="sub2">by '+esc(opts.dishGrouped ? (r.creatorName||r.owner) : r.owner)+' &middot; '+r.mins+' min</p>'
    : '<div class="actrow">'+globe+col+'</div><p class="sub2">'+esc(r.cuisine||'Uncategorized')+' &middot; '+r.mins+' min</p>';
  return '<button class="vcard" onclick="'+onclick+'">'+badge+imageBlock(r)+
    '<div class="meta"><p class="name">'+esc(r.title)+'</p>'+metaLine+'</div></button>';
}
function cardGrid(list, opts){
  if(!list.length) return '';
  return '<div class="grid3">'+list.map(r=>vcard(r,opts)).join('')+'</div>';

    order.map(key=>{

function toggleNewColForm(){ state.boxNewColOpen=!state.boxNewColOpen; rerender(); }

/* Default "Serves" on open: if this recipe is currently filled into an active plan day, default to the plan's
   own headcount (clamped 1–50) so the displayed amounts match what the shopping list is actually using; otherwise
   default to the recipe's own base `servings` (also clamped 1–50). Per-recipe stepper overrides are a display-only
   convenience on this screen — they don't persist into the shopping list, which stays driven by plan headcount
   (see rebuildShoppingListFromPlan) — documented as a deliberate "simplest correct wiring" judgment call. */
function planHeadcountForRecipe(recipeId){
  if(!state.plan) return null;
  return state.plan.days.some(d=>d.recipeId===recipeId) ? state.plan.headcount : null;
}
function openRecipe(id, origin){
  state.detailId = id; state.detailOrigin = origin || 'scr-box';
  state.editingRecipe = false; state.swapEditorFor = null;
  const r = findRecipe(id);
  const base = planHeadcountForRecipe(id) || (r ? r.servings : 4) || 4;
  state.detailServings = clampPeople(base);
  showScreen('scr-recipe-detail');
}
function setDetailServings(v){ state.detailServings = clampPeople(v); rerender(); }
function bumpDetailServings(d){ setDetailServings(state.detailServings+d); }
function toggleEditRecipe(){ state.editingRecipe = !state.editingRecipe; state.swapEditorFor=null; rerender(); }
function provenanceLine(r){
  if(!r.forkedFrom) return '';
  return '<div class="banner" style="margin-bottom:14px"><b>Added from '+esc(r.forkedFrom.label)+'.</b> This is your own independent copy — edits here never travel back, and edits to the original never reach you.</div>';
}
function ingredientRow(r, i, idx){
  const editingSwap = state.swapEditorFor===idx;
  const row = '<div class="ing '+(i.swapped?'swapped':'')+'"><span class="item">'+
      (i.swapped ? '<span class="was">'+esc(i.orig)+'</span> &rarr; <b>'+esc(i.item)+'</b>' : esc(i.item))+
      (i.unscaled ? ' <span class="tag" title="No leading amount to scale — shown as written">doesn\'t scale</span>' : '')+
      (ownedByYou(r.id) ? ' <button class="btn xs quiet" style="padding:0 6px;min-height:22px" onclick="toggleIngredientSwapEditor('+idx+')">'+(i.swapped?'change':'swap')+'</button>' : '')+
    '</span><span class="amt">'+esc(i.amount)+'</span></div>'+
    (i.swapped ? '<p class="tiny" style="margin:-4px 0 8px;color:var(--muted)">'+esc(i.why)+' &middot; <a href="#" onclick="event.preventDefault();revertIngredientSwap('+idx+')" style="color:var(--primary)">revert</a></p>' : '');
  const editorPanel = editingSwap ? ingredientSwapEditor(r, idx) : '';
  return row + editorPanel;
}
function ingredientSwapEditor(r, idx){
  const ing = r.ingredients[idx];
  const presets = r.swaps.filter(s=>s.from.toLowerCase()===ing.item.toLowerCase());
  return '<div class="card pad" style="margin:-2px 0 12px">'+
    (presets.length ? presets.map(p=>'<button class="swapopt" onclick="applyPresetSwap('+idx+',\''+esc(p.to)+'\',\''+esc(p.why)+'\')"><div class="mark">'+ico('swap')+'</div><div class="sbody"><b>'+esc(p.to)+'</b><span class="why">'+esc(p.why)+'</span></div></button>').join('') : '<p class="tiny">No suggested swap for this one — write your own below.</p>')+
    '<label class="field">Or your own swap</label>'+
    '<input class="tin" id="swap-to-'+idx+'" placeholder="swap in…">'+
    '<input class="tin" id="swap-why-'+idx+'" placeholder="why (optional)">'+
    '<div class="row"><button class="btn ghost sm grow" onclick="toggleIngredientSwapEditor('+idx+')">Cancel</button><button class="btn sm grow" onclick="applyCustomSwap('+idx+')">Apply</button></div>'+
  '</div>';
}
function toggleIngredientSwapEditor(idx){ state.swapEditorFor = state.swapEditorFor===idx ? null : idx; rerender(); }
function applyPresetSwap(idx, to, why){
  const r = findRecipe(state.detailId); r.ingredients[idx].swappedTo=to; r.ingredients[idx].swapWhy=why;
  state.swapEditorFor=null; rerender(); toast('Swapped — this recipe and its shopping list will now use "'+to+'".');

function applyCustomSwap(idx){

  const r = findRecipe(state.detailId); r.ingredients[idx].swappedTo=to; r.ingredients[idx].swapWhy=why;

}
function revertIngredientSwap(idx){

function removeHeroImage(){ const r=findRecipe(state.detailId); r.image=null; rerender(); toast('Photo removed.'); }
function deleteRecipe(){

function openCollectionPicker(recipeId){

function openCollectionPickerBulk(){

function renderCollectionPickerSheet(){
  const ids = state.collectionPickerFor || [];

    (state.collections.length ? state.collections.map(c=>{
      const cnt = memberCountFor(c.id); const allIn = cnt===ids.length; const someIn = cnt>0 && !allIn;

        (allIn?'<span class="check">'+ico('check')+'</span>':'')+

        '<span>'+recipesInCollection(c.id).length+' recipe'+(recipesInCollection(c.id).length===1?'':'s')+'</span></button>';
    }).join('') : '<p class="tiny">No collections yet — start one below.</p>')+

    '<div class="row"><input class="tin" id="new-col-name" placeholder="e.g. Weeknight Favorites"><button class="btn ghost sm" onclick="createCollectionFromSheet()">Create</button></div>'+

function toggleRecipeInCollection(cid){
  const ids = state.collectionPickerFor || [];
  const multi = ids.length>1;
  const allIn = ids.length>0 && ids.every(rid=>state.recipeCollections.some(rc=>rc.recipeId===rid && rc.collectionId===cid));
  ids.forEach(rid=>{
    const has = state.recipeCollections.some(rc=>rc.recipeId===rid && rc.collectionId===cid);
    if(allIn && has) removeRecipeFromCollection(rid, cid);
    if(!allIn && !has) addRecipeToCollection(rid, cid);
  });
  if(multi){ renderCollectionPickerSheet(); return; }
  const col = state.collections.find(c=>c.id===cid);
  finishCollectionPicker();
  toast(allIn ? 'Removed from "'+(col?col.name:'that collection')+'".' : 'Added to "'+(col?col.name:'collection')+'".');

function createCollectionFromSheet(){

  (state.collectionPickerFor||[]).forEach(rid=>addRecipeToCollection(rid, c.id));
  if((state.collectionPickerFor||[]).length>1){ renderCollectionPickerSheet(); toast('Added to "'+name+'".'); return; }
  finishCollectionPicker();
  toast('Added to "'+name+'".');
}
function finishCollectionPicker(){

/* ============================================================
   20. SCREEN — Visibility & Share Picker (S10)
   ============================================================ */
function publishRecipeGlobal(id){
  const r = findRecipe(id || state.detailId);
  if(!r || !ownedByYou(r.id)) return;
  if(r.visibility==='global'){
    toast('Already in Browse. You can\'t publish it again.');
    return;
  }
  if(cameFromCatalogue(r)){
    toast('This is already in Browse. Your copy stays personal.');
    return;
  }
  if(state.blocked){
    toast('Publishing is paused on this account. Your recipes are still yours.');
    return;
  }
  r.visibility = 'global';
  rerender();
  toast('Published to Browse. You can\'t fully take it back.');
}
function openVisibilityFromDetail(){
  const r = findRecipe(state.detailId);
  if(!r || r.visibility==='global'){
    toast('Already in Browse. The globe is how you publish.');
    return;
  }
  state.visRecipeId = r.id;
  state.visChoice = r.visibility==='shared' ? 'shared' : 'private';
  state.visRecipients = new Set(r.sharedWith||[]);
  state.visInviteText='';
  showScreen('scr-visibility');
}
function setVisibilityChoice(v){ state.visChoice=v; rerender(); }
function toggleRecipient(name){ state.visRecipients.has(name)?state.visRecipients.delete(name):state.visRecipients.add(name); rerender(); }
function addInviteContact(){
  const v = ($('vis-invite').value||'').trim();
  if(!v){ toast('Type an email or phone to invite.'); return; }
  state.visRecipients.add(v); $('vis-invite').value=''; rerender();
}
function confirmVisibility(){
  const r = findRecipe(state.visRecipeId);
  if(r.visibility==='global'){
    toast('Already in Browse. The globe is how you publish — this screen is only named share.');
    showScreen('scr-recipe-detail');
    return;
  }
  if(state.visChoice==='global'){
    toast('Use the globe on the recipe to publish.');
    return;
  }
  const hadOthers = r.visibility!=='private';
  r.visibility = state.visChoice==='shared' ? 'shared' : 'private';
  r.sharedWith = state.visChoice==='shared' ? [...state.visRecipients] : [];
  if(state.visChoice==='shared' && !state.visRecipients.size){ toast('Pick at least one person to share with.'); r.visibility='private'; return; }
  if(state.visChoice==='shared') toast('Shared with '+[...state.visRecipients].join(', ')+'. They get their own copy if they add it.');
  else toast(hadOthers ? 'Back to personal. Copies already added elsewhere stay theirs.' : 'Personal — only you.');
  showScreen('scr-recipe-detail');
}
function renderVisibility(){
  const r = findRecipe(state.visRecipeId);
  if(r.visibility==='global'){
    return '<p class="banner ok">This is already in Browse. Publishing is the globe on the recipe — you can\'t fully take it back.</p>'+

   21. SCREEN — Incoming Shares (S11)
   ============================================================ */
function alreadyForkedSourceId(sourceId){
  return state.box.find(r=>r.forkedFrom && r.forkedFrom.sourceId===sourceId);
}
/* Station/catalogue can surface a recipe the viewer already owns directly (their own global recipe) —
   that case is "already in your recipes" pointing at itself, not a fork candidate. */
function myBoxCopyOf(id){ return ownedByYou(id) ? findRecipe(id) : alreadyForkedSourceId(id); }
/* Shared fork-on-receipt constructor — same shape every fork-on-add path in the app uses (private visibility,
   independent ingredient/swap copies, zero like count, added-today), differing only in the `forkedFrom`
   provenance label. Extracted here (was duplicated verbatim between addToBox() and acceptShare()) so the
   Swap-search fix's third call site (chooseSwapCandidate(), below) doesn't add a third copy of the same
   object-construction code. */
/* `visibility` param — Visibility-inline fix (2026-08-16). Every call site now passes the caller's inline
   Private/Global choice explicitly; defaults to 'private' if omitted (matches every pre-existing behaviour). */
function forkRecipe(src, forkedFrom, visibility){
  /* Bug fix (2026-08-16, direct code inspection): `sources` must be deep-copied explicitly, same as
     `ingredients` above — it was previously riding along via the outer Object.assign's shallow copy, meaning a
     fork's `sources` array was the SAME array reference as the source recipe's, violating the "forks are
     independent copies" rule already honoured for ingredients/instructions/image_url/creator_name/every other
     field. `swaps` is genuinely fine with a plain `.slice()` (confirmed: swap objects themselves are never
     mutated in place anywhere in this file — only `r.ingredients[idx].swappedTo/swapWhy` are, via
     applyPresetSwap()/applyCustomSwap()/revertIngredientSwap() — so a shallow array copy sharing the same swap
     objects is safe). `boxAddCount` is explicitly reset to 0 here (Solution-Sketch delta #10): a fresh fork
     always starts with its own box_add_count, regardless of the source recipe's value — never aggregated across
     a forked_from lineage, same rule as `likeCount`. `creatorName`/`externalRatingValue`/`externalRatingCount`/
     `externalEngagementCount` are primitives, so they already copy correctly (by value) via the outer
     Object.assign spread — no explicit override needed, and per Solution-Sketch they SHOULD carry over as an
     independent snapshot (unlike boxAddCount/likeCount, which reset). */
  return R(Object.assign({}, src, {id:nid('own'), ingredients:src.ingredients.map(i=>({item:i.item,amount:i.amount})),
    swaps:src.swaps.slice(), sources:src.sources.map(s=>({url:s.url, note:s.note})),
    visibility: visibility||'private', sharedWith:[], likeCount:0, boxAddCount:0, addedDaysAgo:0, forkedFrom}));
}
function getShareVisChoice(id){ return state.shareVisChoices.get(id) || 'private'; }
function setShareVisChoice(id, v){ state.shareVisChoices.set(id, v); rerender(); }
function acceptShare(id){
  const sh = state.sharesIncoming.find(x=>x.id===id); if(!sh) return;
  const src = findRecipe(sh.recipeId);
  if(!src) return;
  beginAdoptDraft({kind:'share', source:src, shareId:id, label:'a share from '+sh.sharerName, vis:getShareVisChoice(id)});
}
function ignoreShare(id){
  const sh = state.sharesIncoming.find(x=>x.id===id); if(!sh) return;
  sh.status='ignored'; rerender(); toast('Ignored.');
}
function toggleSharesHistory(){ state.sharesHistoryOpen=!state.sharesHistoryOpen; rerender(); }
function renderShares(){
  const pending = state.sharesIncoming.filter(s=>s.status==='pending');
  const history = state.sharesIncoming.filter(s=>s.status!=='pending');
  const row = sh => {
    const r = findRecipe(sh.recipeId);
    const already = alreadyForkedSourceId(sh.recipeId);
    return '<div class="card pad" style="margin-bottom:10px"><div class="row">'+smallThumb(r)+
      '<div class="grow"><p class="name" style="font-family:var(--fontDisplay);font-weight:600;color:var(--title);margin:0 0 2px">'+esc(r.title)+'</p><p class="sub" style="margin:0">from '+esc(sh.sharerName)+(r.dishName?' · a version of '+esc(r.dishName):'')+(r.creatorName?' · by '+esc(r.creatorName):'')+'</p></div></div>'+
      (already
        ? '<div class="row" style="margin-top:10px"><span class="tag vis-private" style="flex:1">Already in your recipes</span><button class="btn ghost sm" onclick="openRecipe(\''+already.id+'\',\'scr-shares\')">View</button><button class="btn quiet sm" onclick="ignoreShare(\''+sh.id+'\')">Ignore</button></div>'
        : '<div class="row" style="margin-top:12px"><button class="btn ghost sm grow" onclick="ignoreShare(\''+sh.id+'\')">Ignore</button><button class="btn sm grow" onclick="acceptShare(\''+sh.id+'\')">Add to my recipes</button></div>')+
    '</div>';
  };
  return (pending.length ? pending.map(row).join('') : '<div class="empty"><h3>Nothing shared with you yet</h3><p>When someone shares a recipe with you by name, it shows up here.</p></div>')+
    '<button class="grouphead '+(state.sharesHistoryOpen?'':'closed')+'" onclick="toggleSharesHistory()"><span class="gname">History</span><span class="gcount">'+history.length+'</span><span class="caret">'+ico('down')+'</span></button>'+
    (state.sharesHistoryOpen ? history.map(sh=>{ const r=findRecipe(sh.recipeId);
      return '<div class="card pad" style="margin-bottom:8px;opacity:.75"><p class="tiny">'+esc(r.title)+' from '+esc(sh.sharerName)+' — <b>'+sh.status+'</b></p></div>';
    }).join('') : '');
}

   22. SCREEN — Station: Catalogue Browse / Search (S12)
   ============================================================ */
function onStationSearch(v){ state.stationQuery=v; rerender(); }
function setStationTaste(mode){ state.stationTaste=mode; rerender(); }
function toggleStationFilters(){ state.stationFiltersOpen=!state.stationFiltersOpen; rerender(); }
function setStationCuisine(v){ state.stationCuisine=v; rerender(); }
function setStationIngredient(v){ state.stationIngredient=v; rerender(); }
function setStationSort(v){ state.stationSort=v; rerender(); }
/* Like is a catalogue signal — only recipes in Browse. A private box copy has no public audience. */
function toggleLikeRecipe(id){
  const r = findRecipe(id);
  if(!r) return;
  if(r.visibility!=='global' && !state.catalogue.some(c=>c.id===id)){
    toast('Like is for recipes in Browse.');
    return;
  }
  if(hasLiked(id)){ state.likes.delete(id); if((r.likeCount||0)>0) r.likeCount--; }
  else { state.likes.add(id); r.likeCount = (r.likeCount||0)+1; }
  rerender();
}
/* the catalogue is every visibility=global recipe — including a user's own recipes they made global,
   not just the separate SEED_CATALOGUE array (Design.md Flow 2: global has zero extra steps, immediately catalogue-queryable) */
function stationBaseGlobal(){
  return [...state.catalogue, ...state.box].filter(r=>r.visibility==='global');
}
function stationCandidates(){
  /* used by Search mode only (dish-grouped results) — browse-mode rails use stationRailCands()/trendingList()/
     popularList() below instead of a single flat list */
  let list = stationBaseGlobal();
  const q = state.stationQuery.trim().toLowerCase();
  if(q){
    /* creator_name is matched here too (Solution-Sketch delta #10) — searching "Sanjyot Kher" surfaces her
       recipes, same substring-match approach as every other field in this list. */
    list = list.filter(r=>r.title.toLowerCase().includes(q) || (r.dishName||'').toLowerCase().includes(q) ||
      (r.cuisine||'').toLowerCase().includes(q) || (r.creatorName||'').toLowerCase().includes(q) ||
      names(r).some(n=>n.toLowerCase().includes(q)));
  } else {
    if(state.stationTaste==='liked' && state.profile.cuisinesLiked.size)
      list = list.filter(r=>cuisineTasteHit(r.cuisine, state.profile.cuisinesLiked));
    else if(state.stationTaste==='explore' && state.profile.cuisinesLiked.size)
      list = list.filter(r=>!cuisineTasteHit(r.cuisine, state.profile.cuisinesLiked));
  }
  if(state.stationCuisine) list = list.filter(r=>cuisineMatches(r.cuisine, state.stationCuisine));
  if(state.stationIngredient.trim()) list = list.filter(r=>names(r).some(n=>n.toLowerCase().includes(state.stationIngredient.trim().toLowerCase())));
  /* "Most liked" sort — bias-aware (Solution-Sketch delta #10, Part 2): uses engagementScore(), not a pure
     like_count sort, so this is never the "pure sort by like_count/box_add_count alone" the sketch rules out. */
  if(state.stationSort==='popularity') list = list.slice().sort((a,b)=>engagementScore(b)-engagementScore(a));
  return list;
}
/* ---- Cuisine tabs — computed from whichever cuisines actually exist among global recipes, "All" is default ---- */
function stationCuisines(){
  const present = new Set(stationBaseGlobal().map(r=>r.cuisine).filter(Boolean));
  return CUISINE_TREE.filter(t=>present.has(t.name) || t.children.some(c=>present.has(c))).map(t=>t.name);
}
/* ---- Browse-mode base candidate list: cuisine tab + the (optional) ingredient filter from the filter-icon
   panel — the same underlying data every rail below reads from, just filtered differently ---- */
function stationRailCands(){
  let list = stationBaseGlobal();
  if(state.stationCuisine) list = list.filter(r=>cuisineMatches(r.cuisine, state.stationCuisine));
  if(state.stationIngredient.trim()) list = list.filter(r=>names(r).some(n=>n.toLowerCase().includes(state.stationIngredient.trim().toLowerCase())));
  return list;
}
/* ---- Trending: recent rating velocity, a genuinely different signal from all-time like_count. Simulates
   COUNT(RecipeRating WHERE recipe_id=... AND created_at > now()-7d) over each recipe's likeEvents sample
   (downsampled RecipeRating.created_at ages in days, see the R() defaults comment). Popular stays a flat
   all-time like_count sort — same underlying like data, different query angle, per the task's own framing. ---- */
const TRENDING_WINDOW_DAYS = 7;
function trendingScore(r){ return (r.likeEvents||[]).filter(d=>d<=TRENDING_WINDOW_DAYS).length; }
function tasteFilteredIfAll(list){
  /* the liked/explore taste toggle is a personalization lens on the rails, only meaningful when no single
     cuisine tab is already selected — a specific tab already fully determines the cuisine, so layering taste
     on top of it would just double-filter down to nothing */
  if(state.stationCuisine) return list;
  const liked = state.profile.cuisinesLiked;
  if(!liked.size) return list;
  if(state.stationTaste==='liked') return list.filter(r=>cuisineTasteHit(r.cuisine, liked));
  return list.filter(r=>!cuisineTasteHit(r.cuisine, liked));
}
function trendingList(){
  return tasteFilteredIfAll(stationRailCands()).slice()
    .sort((a,b)=>trendingScore(b)-trendingScore(a) || b.likeCount-a.likeCount).slice(0,8);
}
/* Popular rail — bias-aware (Solution-Sketch delta #10, Part 2), sorted by engagementScore() rather than a pure
   all-time like_count sort, so a low-in-app/high-external-signal recipe can rank competitively here too, not
   just in search. Trending (above) deliberately stays a pure recent-velocity signal — a genuinely different
   query angle per the pre-existing code comment on trendingScore(), not the target of this delta pass. */
function popularList(){
  return tasteFilteredIfAll(stationRailCands()).slice()
    .sort((a,b)=>engagementScore(b)-engagementScore(a)).slice(0,8);
}
function railSubhead(kind){
  if(state.stationCuisine){
    return kind==='trending'
      ? 'Gaining likes fastest this week, in '+esc(state.stationCuisine)+'.'
      : 'All-time most-liked, in '+esc(state.stationCuisine)+'.';
  }
  const liked = state.stationTaste==='liked';
  if(kind==='trending') return liked ? 'Trending in what you like.' : 'Trending — explore something new.';
  return liked ? 'Popular in what you like.' : 'Popular — explore something new.';
}
function railSection(title, subhead, list, emptyMsg){
  return '<div class="rail"><span>'+esc(title)+'</span><span class="cnt">'+list.length+'</span></div>'+
    (subhead ? '<p class="note" style="margin:0 0 10px">'+subhead+'</p>' : '')+
    (list.length
      ? cardGrid(list, {stationMeta:true, onclick:id=>"openCataloguePreview('"+id+"')"})
      : '<p class="tiny" style="padding:2px 0 10px">'+(emptyMsg||'Nothing here yet.')+'</p>');
}
function renderStation(){
  const searching = !!state.stationQuery.trim();
  const stationOpts = {stationMeta:true, onclick:id=>"openCataloguePreview('"+id+"')"};
  const tabsRow = '<div class="chips" style="margin:2px 0 8px">'+
      '<button class="chip '+(!state.stationCuisine?'on':'')+'" onclick="setStationCuisine(\'\')">All</button>'+
      stationCuisines().map(c=>'<button class="chip '+(state.stationCuisine===c?'on':'')+'" onclick="setStationCuisine(\''+c+'\')">'+esc(c)+'</button>').join('')+
    '</div>';
  const filtersRow = '<input class="tin" id="station-ingredient" value="'+esc(state.stationIngredient)+'" oninput="setStationIngredient(this.value)" placeholder="Filter by ingredient — paneer, basil…" style="margin:0 0 10px" autocomplete="off">'+
    (searching ? '<select class="tin" style="margin:0 0 12px" onchange="setStationSort(this.value)"><option value="relevance" '+(state.stationSort==='relevance'?'selected':'')+'>Sort: relevance</option><option value="popularity" '+(state.stationSort==='popularity'?'selected':'')+'>Sort: most liked</option></select>' : '');
  const header = '<p class="lede">'+(searching
    ? 'Same food, different versions. The dish name groups them (Dal, Pav Bhaji). The title and the creator tell them apart.'
    : 'Every global recipe. Search a food name — dal, pav bhaji, dosa — to see every version, not one winner.')+'</p>'+
    '<input class="tin" id="station-search" placeholder="Search dal, pav bhaji, Sanjyot Kher…" value="'+esc(state.stationQuery)+'" oninput="onStationSearch(this.value)" style="margin-bottom:8px" autocomplete="off">'+
    '<div class="chips" style="margin:0 0 12px">'+['dal','pav bhaji','sambar','dosa','biryani'].map(q=>{
      const on = state.stationQuery.trim().toLowerCase()===q;
      return '<button class="chip '+(on?'on':'')+'" onclick="onStationSearch(\''+q+'\')">'+q+'</button>';
    }).join('')+'</div>'+
    tabsRow + filtersRow;

  if(searching){
    const cands = stationCandidates();
    /* groupByDish() also handles this delta pass's other explicit requirement — a dish group always returns
       every matching version, never a truncated subset (Solution-Sketch Flow 4). Verified directly: it groups
       the full filtered `cands` list with no slice/limit applied anywhere in the chain. */
    const groups = groupByDish(cands);
    const qn = state.stationQuery.trim().toLowerCase();
    groups.sort((a,b)=>{
      const aHit = a.name.toLowerCase().includes(qn) ? 0 : 1;
      const bHit = b.name.toLowerCase().includes(qn) ? 0 : 1;
      if(aHit!==bHit) return aHit-bHit;
      return b.items.length-a.items.length;
    });
    const dishGroupedOpts = Object.assign({}, stationOpts, {dishGrouped:true});
    const body = cands.length===0
      ? '<div class="empty"><h3>Nothing here yet</h3><p>Try broadening filters, or be the first to capture and share something like this.</p><button class="btn ghost" onclick="setStationCuisine(\'\')">Clear cuisine filter</button></div>'
      : groups.map(g=>'<div class="rail" style="text-transform:none;letter-spacing:0;font-size:15px;color:var(--title);font-family:var(--fontDisplay);font-weight:600">'+esc(g.name)+(g.items.length>1?' — '+g.items.length+' versions':'')+'</div>'+
        (g.items.length>1?'<p class="note" style="margin:-4px 0 10px">Same food. Each card is someone else\'s version — pick whose you want.</p>':'')+
        cardGrid(g.items, dishGroupedOpts)).join('');
    return header + body;
  }

  const showTasteLens = !state.stationCuisine;
  /* Nice-to-have, trivial, per the task's own "small note if trivial" allowance — cuisines_explore_tag_ids[] is
     deliberately left empty from onboarding now (dish-tile picker only populates cuisines_liked_tag_ids[]), so
     a brand-new user's first visit to Discover has nothing to filter by yet. A one-line note, not a built
     inference/follow-up UI (flagged as a nice-to-have in 00-Handoff.md, not built this pass). */
  const tasteLens = showTasteLens ? '<div class="seg" style="margin:2px 0 4px">'+
      '<button class="'+(state.stationTaste==='liked'?'on':'')+'" onclick="setStationTaste(\'liked\')">For you</button>'+
      '<button class="'+(state.stationTaste==='explore'?'on':'')+'" onclick="setStationTaste(\'explore\')">Discover</button>'+
    '</div>' : '';

  return header + tasteLens +
    railSection('Trending', railSubhead('trending'), trendingList()) +
    railSection('Popular', railSubhead('popular'), popularList());
}

    (state.planHistoryOpen ? hist.map(renderPastWeek).join('') : '');
}
function renderPastWeek(p){
  const cooked = p.days.filter(d=>d.ritual==='yes'||d.ritual==='again').length;

    '<div class="spread"><b>Archived '+esc(when)+'</b><span class="tiny">'+cooked+' cooked · '+skipped+' skipped</span></div>'+
    '<p class="tiny" style="margin:6px 0 0">'+p.days.map(d=>{
      const r = d.recipeId ? findRecipe(d.recipeId) : null;
      const mark = d.ritual==='again'?' (loved)':d.ritual==='yes'?' (cooked)':d.ritual==='skip'?' (skipped)':'';
      return esc(mealSlotLabel(d.dayIndex))+': '+(r?r.title:'unfilled')+mark;
    }).join(' · ')+'</p></div>';
}

/* ============================================================
   25. SCREEN — Plan View (S15) + Share this plan (inline panel)
   ============================================================ */
/* Plan-share fix (2026-08-16) — "Share this plan" is now a plain link share, not a named-recipient picker
   (the recipe-level "Shared with specific people" tier on Visibility & Share Picker, S10, is untouched — this
   change is scoped to plans only). Mirrors PlanShare {id, plan_id, share_token, created_at, revoked_at}:
   POST /api/plans/:id/share creates/returns an ACTIVE share token for this plan (idempotent — reopening the
   panel reuses the existing live token rather than minting a new one every time), and GET /api/shared-plan/:token
   is the public, unauthenticated, read-only view that token would resolve to. Simulated entirely client-side
   here — a plausible-looking fake token/URL, no real network call, no real public route; "Copy link" just
   toasts a confirmation, matching the reference Prototype.html's own openShare() panel's tone and simplicity. */
function genShareToken(){ return Math.random().toString(36).slice(2,10).toUpperCase(); }
function mintShare(path){
  const token = genShareToken();
  return { token, url:'https://recipebox.app/'+path+'/'+token, createdAt:Date.now(), revokedAt:null };
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  }
  fallbackCopy(text);
  return Promise.resolve();
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
function copyShareUrl(url, what){
  copyToClipboard(url);
  closeSheet();
  toast('Link copied — anyone with it can view this '+what+'.');
}
function sendShareUrl(url, what){
  if(navigator.share){
    navigator.share({title:'Recipe Box', text:'A '+what+' from Recipe Box', url:url})
      .then(function(){ closeSheet(); })
      .catch(function(){ copyShareUrl(url, what); });
    return;
  }
  copyShareUrl(url, what);
}
function linkShareSheet(title, note, url, what){
  const showGlobeNote = (what==='recipe' || what==='collection');
  openSheet('<h3>'+esc(title)+'</h3>'+
    '<p class="note">'+note+'</p>'+
    '<p class="tiny" style="margin:10px 0;word-break:break-all">'+esc(url)+'</p>'+
    '<div class="row wrap">'+
      '<button class="btn grow" onclick="copyShareUrl(\''+jsStr(url)+'\',\''+jsStr(what)+'\')">'+ico('link')+' Copy link</button>'+
      '<button class="btn ghost grow" onclick="sendShareUrl(\''+jsStr(url)+'\',\''+jsStr(what)+'\')">'+ico('share')+' Share…</button>'+
    '</div>'+
    (showGlobeNote ? '<p class="tiny" style="margin-top:10px">This is not Browse. Globe is how a recipe goes public.</p>' : ''));
}
function ensureRecipeShareToken(r){
  if(!r.share || r.share.revokedAt) r.share = mintShare('r');
  return r.share;
}
function openRecipeLinkShare(id){
  const r = findRecipe(id); if(!r) return;
  const s = ensureRecipeShareToken(r);
  linkShareSheet('Share this recipe',
    'Anyone with the link can view it and add their own copy. Not a public Browse listing.',
    s.url, 'recipe');
}
function ensureCollectionShareToken(c){
  if(!c.share || c.share.revokedAt) c.share = mintShare('c');
  return c.share;
}
function openCollectionLinkShare(id){
  const c = state.collections.find(x=>x.id===id); if(!c) return;
  const s = ensureCollectionShareToken(c);
  linkShareSheet('Share '+c.name,
    'Anyone with the link can view this collection. They add recipes they want as their own copies.',
    s.url, 'collection');
}
function ensurePlanShareToken(){
  if(!state.plan) return null;
  if(!state.plan.share || state.plan.share.revokedAt){
    const token = genShareToken();
    state.plan.share = { id:'ps'+Date.now(), token, url:'https://recipebox.app/shared-plan/'+token, createdAt:Date.now(), revokedAt:null };
  }
  return state.plan.share;
}
function openPlanLinkShare(){
  const s = ensurePlanShareToken();
  if(!s) return;
  linkShareSheet('Share this week',
    'Anyone with the link can view this week and the shopping list. They don’t need an account.',
    s.url, 'week');
}
function dayCard(d){
  const r = d.recipeId ? findRecipe(d.recipeId) : null;
  return '<div class="day '+(r?'':'unfilled')+'">'+
    (r ? smallThumb(r) : '')+
    '<div class="grow"><div class="slotlab">'+esc(mealSlotLabel(d.dayIndex))+' · '+esc(d.facetType==='surprise'?'Surprise':d.facetValue)+'</div>'+
    (r ? '<div class="dname" onclick="openRecipe(\''+r.id+'\',\'scr-plan\')" style="cursor:pointer">'+esc(r.title)+'</div><div class="dsub">'+r.mins+' min &middot; '+esc(r.cuisine||'—')+'</div>'
       : '<div class="dname" style="color:var(--muted)">Unfilled</div><div class="dsub">Nothing in your recipes matched this seat.</div>')+
    (r ? '<div class="ritual">'+

      '<button class="mark '+(d.ritual==='skip'?'on':'')+'" title="Skip" onclick="resolveCookRitual('+d.dayIndex+',\'skip\')">'+ico('x')+'</button>'+
      '<button class="mark love '+(d.ritual==='again'?'on':'')+'" title="Loved" onclick="resolveCookRitual('+d.dayIndex+',\'again\')">'+ico('heart')+'</button>'+

function renderPlan(){

  return state.plan.days.map(dayCard).join('')+

/* ============================================================
   26. OVERLAY — Swap / Find Similar (S16)
   ============================================================ */
/* Swap-search fix (2026-08-16) — swapOverlay now also tracks `source` ('box' | 'browse') and `query` (free-text search),
   on top of the pre-existing `mode` (cuisine/category/ingredients similarity). Defaults preserve the exact
   pre-Fix-2 default view: source='box', query='' means swapCandidates() returns precisely what it always did —
   the slot-matched, cuisine-similar list from the user's own Box — so the picker never opens to an empty/changed
   default. Search and the Box/Browse toggle are additive layers on top, per the task's explicit requirement. */
function openSwapOverlay(dayIndex){ state.swapOverlay = {dayIndex, mode:'cuisine', source:'box', query:'', visChoice:'private'}; renderSwapSheet(); }
function openFillOverlay(dayIndex){ state.swapOverlay = {dayIndex, mode:'category', source:'browse', query:'', visChoice:'private'}; renderSwapSheet(); }
function setSwapSimilarity(mode){ state.swapOverlay.mode=mode; renderSwapSheet(); }
function setSwapSource(source){ state.swapOverlay.source=source; renderSwapSheet(); }
function onSwapSearch(v){ state.swapOverlay.query=v; renderSwapSheet(); }
/* Visibility-inline fix (2026-08-16) — only relevant when source==='browse' (picking from Box never forks, so
   there's no visibility to choose there). Defaults to Private, switchable in place, same pattern as every other
   add-to-Box path. */
function setSwapVisChoice(v){ state.swapOverlay.visChoice=v; renderSwapSheet(); }
/* 'box' = the user's own Box (pre-existing behaviour, still the default). 'browse' = the global catalogue,
   excluding anything already owned (an owned copy belongs under "From my Box" instead). Replaces the old
   `state.plan.mixInBrowse`-conditional pool-widening that used to silently decide whether Browse recipes were
   swap candidates — the Swap-search fix makes reaching into Browse during a swap an explicit, visible, user-initiated toggle
   instead, which is deliberately a different rule from Generate's "always defaults to your own Box, mixInBrowse
   is the only opt-in" model: a manual swap pick is fully visible and initiated by the user themselves, so the
   earlier "never silently mix in unverified global recipes" reasoning for Generate doesn't apply here. */
function swapPoolForSource(source){
  return source==='browse' ? stationBaseGlobal().filter(r=>!ownedByYou(r.id)) : state.box.slice();
}
function swapCandidates(){
  const d = state.plan.days.find(x=>x.dayIndex===state.swapOverlay.dayIndex);
  const current = d.recipeId ? findRecipe(d.recipeId) : null;
  const usedIds = new Set(state.plan.days.map(x=>x.recipeId).filter(Boolean));
  const pool = swapPoolForSource(state.swapOverlay.source);
  let cands = pool.filter(r=>!usedIds.has(r.id) && (!current || r.id!==current.id));
  const q = state.swapOverlay.query.trim().toLowerCase();
  if(q){
    cands = cands.filter(r=>r.title.toLowerCase().includes(q) || (r.dishName||'').toLowerCase().includes(q) ||
      names(r).some(n=>n.toLowerCase().includes(q)));
  } else if(!current || state.swapOverlay.mode==='category'){
    cands = cands.filter(r=>matchesFacet(r,{facetType:d.facetType, facetValue:d.facetValue, collectionId:d.collectionId}));
    if(!cands.length) cands = pool.filter(r=>!usedIds.has(r.id) && (!current || r.id!==current.id));
  } else if(state.swapOverlay.mode==='cuisine' && current){
    const anchor = cuisineParent(current.cuisine) || current.cuisine;
    cands = cands.filter(r=>cuisineMatches(r.cuisine, anchor) || r.cuisine===current.cuisine);
  }
  return cands.slice(0,8).map(r=>({r, overlap: current ? names(r).filter(n=>names(current).includes(n)) : []}));
}
function renderSwapSheet(){
  const d = state.plan.days.find(x=>x.dayIndex===state.swapOverlay.dayIndex);
  const current = d.recipeId ? findRecipe(d.recipeId) : null;
  const so = state.swapOverlay;
  const searching = !!so.query.trim();
  const cands = swapCandidates();
  const filling = !current;
  openSheet('<h3>'+(filling?'Fill ':'Swap ')+mealSlotLabel(d.dayIndex)+'</h3><p class="note" style="margin-bottom:10px">'+(filling
    ? 'Nothing matched this seat. Pick from Browse or your recipes — only this meal changes.'
    : 'Replacing "'+esc(current.title)+'". Only this meal changes.')+'</p>'+
    '<input class="tin" id="swap-search" placeholder="Search by name or ingredient — try &quot;paneer&quot;…" value="'+esc(so.query)+'" oninput="onSwapSearch(this.value)" style="margin-bottom:10px" autocomplete="off">'+
    '<div class="seg" style="margin-bottom:10px">'+
      '<button class="'+(so.source==='box'?'on':'')+'" onclick="setSwapSource(\'box\')">From my recipes</button>'+
      '<button class="'+(so.source==='browse'?'on':'')+'" onclick="setSwapSource(\'browse\')">From Browse</button>'+
    '</div>'+
    (so.source==='browse' ? '<p class="helper" style="margin:0 0 10px">Adds a personal copy to your recipes, then puts it on this meal. It is already in Browse — you are not publishing it again.</p>' : '')+
    (searching || filling ? '' : '<div class="seg" style="margin-bottom:12px">'+
      ['cuisine','category','ingredients'].map(m=>'<button class="'+(so.mode===m?'on':'')+'" onclick="setSwapSimilarity(\''+m+'\')">'+m+'</button>').join('')+
    '</div>')+
    (cands.length ? cands.map(c=>{
      const needsFork = so.source==='browse';
      const tagBits = [];
      if(needsFork) tagBits.push('<span class="tag">Adds a personal copy</span>');
      if(c.overlap.length) tagBits.push('<span class="tag">shares '+c.overlap.slice(0,3).join(', ')+'</span>');
      return '<div class="rcard" style="cursor:pointer;margin-bottom:9px" onclick="chooseSwapCandidate('+d.dayIndex+',\''+c.r.id+'\')">'+imageBlock(c.r)+
        '<div class="meta"><p class="name">'+esc(c.r.title)+'</p><p class="sub">'+c.r.mins+' min &middot; '+esc(c.r.cuisine||'—')+(needsFork?' &middot; by '+esc(c.r.owner):'')+'</p>'+
        (tagBits.length ? '<div class="tags">'+tagBits.join('')+'</div>' : '')+
        '</div></div>';
    }).join('')
      : '<div class="empty"><h3>No matches</h3><p>'+(searching ? 'Nothing in '+(so.source==='box'?'your recipes':'Browse')+' matches that search.' : 'Try a different similarity mode, or search by name or ingredient above.')+'</p></div>')+
    '<button class="btn quiet block" style="margin-top:8px" onclick="closeSwap()">Cancel</button>');
}
function chooseSwapCandidate(dayIndex, newId){
  const d = state.plan.days.find(x=>x.dayIndex===dayIndex);
  const so = state.swapOverlay;
  let finalId = newId;
  let forked = false;
  if(!ownedByYou(newId)){
    /* Picking a Browse/global-catalogue recipe as the swap-in forks it into the user's Box first — same
       fork-on-add behaviour as addToBox()/acceptShare() (independent copy, never a live reference to the
       original), now carrying the picker's own inline Private/Global visibility choice (so.visChoice, default
       'private') instead of always hardcoding private — then the NEW fork's id is what gets assigned to this
       day's slot, never the original global recipe's id. This is a deliberate, explicit, user-initiated pick
       (the user searched Browse, saw the recipe, and tapped it themselves), unlike Generate's "mix in a few
       Browse picks," which is why it's allowed here even though Generate itself never silently reaches into
       Browse by default. */
    const src = findRecipe(newId);
    const fork = forkRecipe(src, {kind:'catalogue', label:'the catalogue, by '+src.owner, sourceId:src.id}, 'private');
    /* box_add_count trigger point 2 of 2 (Solution-Sketch delta #10) — swap-in-from-Browse is organic-discovery
       adoption too (the user searched Browse and picked this themselves), same rule as addToBox() above. */
    implicitTasteFromRecipe(src, 1);
    src.boxAddCount = (src.boxAddCount||0) + 1;
    state.box.unshift(fork);
    finalId = fork.id;
    forked = true;
  }
  const wasEmpty = !d.recipeId;
  d.swappedFromRecipeId = d.recipeId; d.recipeId = finalId; d.ritual=null;
  if(state.plan && state.plan.committed) rebuildShoppingListFromPlan();
  closeSheet(); state.swapOverlay=null;
  rerender();
  toast(wasEmpty
    ? (forked ? 'Added a personal copy from Browse to this meal.' : 'Filled this meal.')
    : (forked ? 'Added a personal copy and swapped it in.' : (state.plan && state.plan.committed ? 'Swapped — shopping list updated.' : 'Swapped.')));
}
function closeSwap(){ closeSheet(); state.swapOverlay=null; }

/* ============================================================
   27. SCREEN — Shopping List (S17, flat list, no pantry split)
   ============================================================ */
function goAdHocSelect(){ state.selectMode=true; state.selectedIds.clear(); showScreen('scr-box'); }
function openShopLinkShare(){
  const l = state.shoppingList; if(!l) return;
  if(l.linkedToPlan){
    const s = ensurePlanShareToken();
    if(!s) return;
    linkShareSheet('Share this list',
      'Anyone with the link can view this week and this shopping list.',
      s.url, 'shopping list');
    return;
  }
  const text = shopListText();
  openSheet('<h3>Share this list</h3>'+
    '<p class="note">Sends the list with quantities as text.</p>'+
    '<p class="tiny" style="margin:10px 0;white-space:pre-wrap;word-break:break-word">'+esc(text)+'</p>'+
    '<div class="row wrap">'+
      '<button class="btn grow" onclick="copyAdHocShopList()">'+ico('link')+' Copy list</button>'+
      '<button class="btn ghost grow" onclick="sendAdHocShopList()">'+ico('share')+' Share…</button>'+
    '</div>');
}
function copyAdHocShopList(){
  copyToClipboard(shopListText());
  closeSheet();
  toast('List copied — paste into Messages or WhatsApp.');
}
function sendAdHocShopList(){
  const text = shopListText();
  if(navigator.share){
    navigator.share({title:'Shopping list', text:text})
      .then(function(){ closeSheet(); })
      .catch(function(){ copyAdHocShopList(); });
    return;
  }
  copyAdHocShopList();
}
function shopListText(){
  const l = state.shoppingList; if(!l) return '';
  const line = it => (it.checked?'☑ ':'☐ ')+(it.amount?it.amount+' — ':'')+it.name;
  const blocks = [l.sourceLabel];
  groupShopItems(l.items).forEach(sec=>{
    blocks.push('', sec.label.toUpperCase());
    sec.items.forEach(it=>blocks.push(line(it)));
  });
  return blocks.join('\n');
}

function renderShoppingList(){
  if(!state.shoppingList) return '<div class="empty"><h3>Nothing planned yet</h3><p>Generate a week, or pick a few recipes straight from your recipes.</p>'+
    '<div class="row" style="justify-content:center;margin-top:6px"><button class="btn" onclick="go(\'scr-generate-setup\')">Generate a week</button><button class="btn ghost" onclick="goAdHocSelect()">Pick from my recipes</button></div></div>';
  const l = state.shoppingList;
  const checkedCount = l.items.filter(i=>i.checked).length;
  const backLabel = l.linkedToPlan ? 'Back to this week' : 'Back to my recipes';
  const backTo = l.linkedToPlan ? 'scr-plan' : 'scr-box';
  const groups = groupShopItems(l.items);
  return '<p class="note" style="margin-bottom:6px">'+esc(l.sourceLabel)+'</p>'+
    '<div class="progressbar" style="margin-bottom:14px"><i style="width:'+(l.items.length?Math.round(100*checkedCount/l.items.length):0)+'%"></i></div>'+
    groups.map(sec=>'<div class="rail">'+esc(sec.label)+'<span class="cnt">'+sec.items.length+'</span></div>'+
      '<div class="card pad">'+sec.items.map(shopItemRow).join('')+'</div>').join('')+
    '<div class="row wrap" style="margin-top:14px">'+
      '<button class="btn ghost grow" onclick="go(\''+backTo+'\')">'+ico('back')+' '+backLabel+'</button>'+
      '<button class="btn ghost grow" onclick="openShopLinkShare()">'+ico('share')+' Share list</button>'+
      (l.linkedToPlan
        ? '<button class="btn ghost grow" onclick="goAdjustFromPlan()">'+ico('spark')+' Edit shape</button>'
        : '<button class="btn ghost grow" onclick="goAdHocSelect()">Change selection</button>')+
    '</div>';
}
