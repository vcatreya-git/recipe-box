<title>Recipe Box — Prototype v2</title>
<!--
  Recipe Box — PROTOTYPE v2 (Prototype-v2.html)
  Base: Claude's Prototype-Full.html (7c, through seed catalogue 59 + sketch delta #13 intent).
  This file is a NEW version. Prototype-Full.html is untouched.

  v2 product deltas (2026-08-16, Grok):
   - Generate: dietary_mix UI removed. headcount is servings only. Diet comes from Profile.
   - Profile/onboarding: diet_animal_stance[] + diet_frameworks[] (non-veg is inclusive).
   - Confirm: extraction confidence banner; needsCare on the recipe; Global asks again if still unchecked.
   - Capture: extract rate limit (billable methods only) + remaining count; blocked kill-switch (extract/Global only).
   - Taste: strong signals stop filling the board with more of the same; implicit ticks from add-to-box, swap, browse.
   - a–p recon (2026-08-16): two-level CuisineTag (parent includes children). Sketch #14 + Design v1.4 closed in Obsidian.

  Recipe Box — Phase 7c POLISHED PROTOTYPE (Prototype-Full.html) — original header follows for history.
  Built 2026-08-15 against Design.md v1.3, iterated through several 7c-only passes (card-grid/Collections,
  Station tabs/rails). 2026-08-16 large consolidated pass (this one) — see 00-Handoff.md for the full dated
  entry — reshapes navigation and several flows off direct product-owner feedback + a structured critique.
  Design.md/Solution-Sketch.md/PRD.md were NOT updated to match; drift is flagged in 00-Handoff.md, not fixed here.

  Model backbone (NOT simplified away):
   - S1 auth; S2 intent-gated onboarding; S2b profile (diet_type / dietary_restrictions[] required+explicit;
     cuisines_liked_tag_ids[] now captured via a Spotify-style dish-tile taste picker, not a chip list;
     cuisines_explore_tag_ids[]/diet_type_explore[] deliberately left unset from onboarding, see below);
     S3 week-skeleton (conditional, silently seeded when skipped)
   - Three-tier visibility (private / shared with specific people / global) + fork-on-receipt, never merge-back.
     Visibility badges only render for Shared/Global — Private (the default) shows no badge anywhere.
   - RecipeShare + PlanShare with working Accept/Ignore; PlanShare is view-only, never a fork
   - Global catalogue ("Browse" — internally still coded as Station/`scr-station*`, see naming note below) with
     cuisine tabs, Trending/Popular rails, taste=liked|explore lens, search. Liking is UN-GATED as of this pass —
     any user can like/unlike any visibility=global recipe directly, no box-ownership prerequisite (UX-layer
     reversal of the RecipeRating "who can rate" gate — see 00-Handoff.md, Solution-Sketch still describes the
     old gate and needs a follow-up delta). "Follow a cook" is REMOVED entirely this pass — no Follow button
     anywhere, no followed-cooks rail/filter (Solution-Sketch's `Follow` entity is now dead, flagged not removed).
   - Recipe.image_url end-to-end: schema.org image / og:image / video thumbnail / screenshot / manual upload /
     no-image cuisine-tinted placeholder fallback
   - Capture (paste link / screenshot / type name, + simulated clipboard-detect nudge) -> Inbox -> Confirm/Edit/
     Discard -> Box
   - Flat ingredient list everywhere; shopping list is a plain manual checklist (no Pantry Inventory screen).
     Recipe Detail now has a 1–5 "Serves" stepper that scales parseable ingredient amounts proportionally
     (unparseable freeform amounts are labelled "doesn't scale," never guessed) — a generated plan's shopping
     list scales each recipe's contribution off the plan's own headcount by default.
   - Cook ritual (thumbs / skip / make again); recency-exclude + intent-weighted generation
   - Collections: private, user-named, many-to-many recipe grouping, additive to cuisine tagging, never shared

  NAVIGATION (this pass — was 5 tabs + a hidden Dashboard + FAB, now 4 tabs + FAB, no hidden home):
   Browse · My Box · This Week · Profile. "This Week" is Generate+Plan combined — shows the generate action when
   there's no plan, the plan view once there is one. Shopping List is reached FROM This Week (button), not a tab.
   The old Dashboard (cook-ritual prompt, idea pool, quick links) is folded into a "for you today" strip at the
   top of My Box, rendered only when there's something to show — no more hidden/logo-only home screen.

  NAMING (this pass): "Station" tab renamed "Browse" in all user-facing copy; "Playlist" dropped from user-facing
  copy entirely. Internal ids/function names (scr-station*, stationCandidates(), etc.) were deliberately left
  alone — the task scoped this as a copy-only rename, not an identifier rename, to keep the diff reviewable.

  GENERATE (this pass): the old 4-step gate (intent + headcount + meal count + Playlist-vs-Station mode, all
  required before Generate would even run) is gone. Generate now always sources from the user's own Box by
  default (never silently mixing in unverified global recipes) with sensible defaults (balanced intent,
  household size from Profile or 2, a full 7-day week) — one tap produces a week immediately. Intent, headcount,
  meal count, and an explicit opt-in "mix in a few Browse picks" toggle live in a collapsed "Adjust" panel.

  Adapted from the product owner's reference prototype + PRD Section 4 competitor research (earlier passes):
   - Two-tone theme: warm cookbook (Box/Browse/Recipe/Capture) vs dark planning board (This Week/List)
   - "Cook without saving" framing on catalogue previews (PRD Persona 2, Recipe Collector)
   - Dish-grouped catalogue search ("Sambar — 3 versions")
   - Concrete, human share copy naming the actual people
   - Inline cook-ritual chips on the Plan view
   - Ingredient-level swap-and-save inside a recipe (complementary to the day-level swap on the Plan)
   - Flexible skeleton buckets (facet_type, facet_value, count) replacing the rigid 7 fixed category slots
     >>> DATA-MODEL EVOLUTION of CategorySlotDefinition — see 00-Handoff.md, needs a Solution-Sketch delta pass
   - Soft, freely switchable Browse / Plan emphasis (onboarding still seeds it; never a one-way gate)
-->

<style>
  #app{
    /* WARM COOKBOOK THEME — Box, Station, Recipe, Capture, Onboarding, Profile */
    --bg:#F4EEE0; --surface:#FFFCF5; --surface2:#EFE7D4; --sunken:#EAE1CC;
    --text:#2B2521; --title:#1E4034; --muted:#7B7064; --line:#E2D8C0;
    --accent:#A87C25; --accentSoft:#F3E7C4;
    --primary:#B5533C; --primaryInk:#FFF7F3;
    --ok:#3F7A5B; --okSoft:#E1EFE4; --warn:#9A6414; --warnSoft:#F8ECD2;
    --pill:#E3EDE5; --pillInk:#1E4034;
    --fontDisplay:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --shadow:0 6px 20px rgba(43,37,33,.08); --shadowUp:0 -6px 20px rgba(43,37,33,.10);
  }
  #app.board{
    /* DARK KITCHEN-BOARD THEME — Generate, Plan, Shopping List */
    --bg:#14181C; --surface:#1E242A; --surface2:#262E36; --sunken:#11151A;
    --text:#E7EEF3; --title:#F5F9FC; --muted:#95A1AB; --line:#313A44;
    --accent:#E9B84C; --accentSoft:#3A3320;
    --primary:#E9B84C; --primaryInk:#2A1E00;
    --ok:#5FC49A; --okSoft:#1E3A31; --warn:#E9B84C; --warnSoft:#3A3320;
    --pill:#2B333B; --pillInk:#CFE0D6;
    --fontDisplay:"Inter",-apple-system,system-ui,sans-serif;
    --shadow:0 8px 24px rgba(0,0,0,.35); --shadowUp:0 -8px 24px rgba(0,0,0,.4);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  svg{ width:16px; height:16px; flex-shrink:0; vertical-align:-3px; } /* fallback for icons used outside a sized wrapper (banners, opt cards, bucket labels) */
  .opt .check svg{ width:14px; height:14px; vertical-align:-2px; }
  html,body{ margin:0; height:100%; background:#20211E; }
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    width:100%; max-width:430px; height:100%; max-height:940px; background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 30px 80px rgba(0,0,0,.5);
    transition:background .25s ease, color .25s ease;
  }
  @media(min-width:520px) and (min-height:900px){ #app{ border-radius:26px; } }

  /* ---------- chrome ---------- */
  header{
    display:flex; align-items:center; gap:8px; padding:14px 14px 12px;
    background:var(--bg); border-bottom:1px solid var(--line); flex-shrink:0; position:relative; z-index:6;
  }
  header .htitle{
    flex:1; min-width:0; font-family:var(--fontDisplay); font-size:21px; font-weight:600;
    color:var(--title); margin:0; letter-spacing:-.02em; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header .hsub{ font-size:11px; color:var(--muted); font-weight:500; letter-spacing:.02em; margin:2px 0 0; font-family:"Inter",sans-serif; }
  .iconbtn{
    width:40px; height:40px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:12px; cursor:pointer; padding:0;
  }
  .iconbtn:active{ transform:scale(.96); }
  .iconbtn.plain{ border-color:transparent; background:transparent; }
  .iconbtn svg{ width:19px; height:19px; }
  .badge-dot{
    position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px;
    background:var(--primary); color:var(--primaryInk); border-radius:9px; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .rel{ position:relative; }

  main{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 108px;
    background:var(--bg); transition:background .25s ease;
  }
  main.full{ padding:0 0 0; }
  nav{
    position:absolute; left:0; right:0; bottom:0; display:flex; z-index:8;
    background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:var(--shadowUp);
  }
  nav button{
    flex:1; min-height:58px; border:0; background:transparent; color:var(--muted);
    font-size:10.5px; font-weight:600; cursor:pointer; padding:9px 2px 8px; letter-spacing:.01em;
    display:flex; flex-direction:column; align-items:center; gap:4px; position:relative;
  }
  nav button svg{ width:21px; height:21px; }
  nav button.on{ color:var(--title); }
  nav button.on::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--primary);
  }
  nav .nbadge{
    position:absolute; top:6px; right:calc(50% - 20px); min-width:16px; height:16px; padding:0 4px;
    background:var(--primary); color:var(--primaryInk); border-radius:8px; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .fab{
    position:absolute; right:16px; bottom:76px; width:56px; height:56px; border-radius:50%;
    border:0; background:var(--primary); color:var(--primaryInk); cursor:pointer; z-index:7;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px rgba(181,83,60,.38);
  }
  .fab svg{ width:24px; height:24px; }
  .fab:active{ transform:scale(.95); }

  /* ---------- type ---------- */
  h2.section{ font-family:var(--fontDisplay); font-size:22px; font-weight:600; color:var(--title); margin:0 0 4px; letter-spacing:-.02em; }
  .rail{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin:22px 0 10px;
  }
  .rail:first-child{ margin-top:4px; }
  .rail .cnt{ color:var(--muted); font-weight:600; letter-spacing:.06em; }
  .lede{ font-size:13.5px; line-height:1.5; color:var(--muted); margin:0 0 14px; }
  .note{ font-size:12.5px; line-height:1.5; color:var(--muted); margin:0; }
  .tiny{ font-size:11.5px; color:var(--muted); }
  b.hi{ color:var(--text); font-weight:600; }

  /* ---------- generic surfaces ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .pad{ padding:14px; }
  .stack>*+*{ margin-top:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.wrap{ flex-wrap:wrap; }
  .spread{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .grow{ flex:1; min-width:0; }
  .hr{ height:1px; background:var(--line); margin:14px 0; border:0; }

  /* ---------- buttons ---------- */
  .btn{
    min-height:48px; padding:0 18px; border-radius:13px; border:1px solid transparent; cursor:pointer;
    font-family:"Inter",sans-serif; font-size:14.5px; font-weight:650; letter-spacing:.01em;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--primary); color:var(--primaryInk);
  }
  .btn svg{ width:17px; height:17px; }
  .btn:active{ transform:scale(.985); }
  .btn.block{ width:100%; }
  .btn.ghost{ background:var(--surface); color:var(--text); border-color:var(--line); }
  .btn.quiet{ background:transparent; color:var(--muted); border-color:transparent; font-weight:600; }
  .btn.dark{ background:var(--title); color:var(--bg); }
  .btn.sm{ min-height:38px; padding:0 13px; font-size:13px; border-radius:10px; }
  .btn.xs{ min-height:32px; padding:0 11px; font-size:12px; border-radius:9px; }
  .btn[disabled], .btn.off{ opacity:.45; }
  .btn.danger{ background:transparent; color:#B3402C; border-color:#E3C4BC; }
  #app.board .btn.danger{ color:#F09B86; border-color:#4A3630; }

  /* ---------- chips ---------- */
  .chips, .chips.wrap{ display:flex; flex-wrap:wrap; gap:8px; overflow:visible; padding:2px 0 6px; }
  .chip{
    flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:999px; padding:9px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
    min-height:38px; display:inline-flex; align-items:center; gap:6px;
  }
  .chip.on{ background:var(--title); color:var(--bg); border-color:var(--title); }
  #app.board .chip.on{ background:var(--accent); color:var(--primaryInk); border-color:var(--accent); }
  .chip.like{ background:var(--okSoft); border-color:var(--ok); color:var(--ok); }
  .chip.explore{ background:var(--accentSoft); border-color:var(--accent); color:var(--accent); }
  .chip.rm{ padding-right:9px; }
  .tag{
    font-size:10.5px; font-weight:600; letter-spacing:.02em; background:var(--pill); color:var(--pillInk);
    padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .tag.vis-private{ background:var(--sunken); color:var(--muted); }
  .tag.vis-shared{ background:var(--warnSoft); color:var(--warn); }
  .tag.vis-global{ background:var(--okSoft); color:var(--ok); }
  .tag.alert{ background:#F6E2DC; color:#A2432E; }
  #app.board .tag.alert{ background:#3B2723; color:#EFA994; }

  /* ---------- inputs ---------- */
  .field{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:16px 0 7px; }
  .field:first-child{ margin-top:0; }
  input.tin, textarea.tin, select.tin{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--surface); color:var(--text); font-size:15.5px; font-family:"Inter",sans-serif;
    -webkit-appearance:none; appearance:none;
  }
  select.tin{ background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:36px; }
  input.tin::placeholder, textarea.tin::placeholder{ color:var(--muted); opacity:.75; }
  input.tin:focus, textarea.tin:focus, select.tin:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea.tin{ line-height:1.5; resize:vertical; }
  .inline-err{ font-size:12.5px; color:#B3402C; margin:8px 0 0; font-weight:600; }
  #app.board .inline-err{ color:#F09B86; }
  .helper{ font-size:12px; color:var(--muted); margin:7px 0 0; line-height:1.45; }

  /* stepper */
  .stepper{ display:inline-flex; align-items:center; gap:2px; background:var(--surface2); border-radius:11px; padding:3px; }
  .stepper button{
    width:36px; height:36px; border:0; background:var(--surface); color:var(--text); border-radius:9px;
    font-size:19px; line-height:1; cursor:pointer; font-weight:600;
  }
  .stepper button:active{ transform:scale(.94); }
  .stepper .val{ min-width:34px; text-align:center; font-size:15px; font-weight:700; }
  .stepper input.val{
    width:3.4em; min-width:3.4em; border:0; background:transparent; color:inherit;
    font: inherit; font-weight:700; padding:0; -moz-appearance:textfield;
  }
  .stepper input.val::-webkit-outer-spin-button,
  .stepper input.val::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  /* segmented */
  .seg{ display:flex; background:var(--surface2); border-radius:13px; padding:4px; gap:4px; }
  .seg button{
    flex:1; min-height:40px; border:0; border-radius:10px; background:transparent; color:var(--muted);
    font-size:13px; font-weight:650; cursor:pointer; font-family:"Inter",sans-serif;
  }
  .seg button.on{ background:var(--surface); color:var(--title); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  #app.board .seg button.on{ background:var(--accent); color:var(--primaryInk); }

  /* option card (radio-ish) */
  .opt{
    display:block; width:100%; text-align:left; border:1.5px solid var(--line); background:var(--surface);
    border-radius:15px; padding:14px; cursor:pointer; color:var(--text); font-family:"Inter",sans-serif;
  }
  .opt+.opt{ margin-top:9px; }
  .opt b{ display:block; font-size:15px; font-weight:650; margin-bottom:3px; color:var(--title); }
  .opt span{ display:block; font-size:12.5px; color:var(--muted); line-height:1.45; }
  .opt.on{ border-color:var(--primary); background:linear-gradient(0deg,var(--accentSoft),var(--accentSoft)); }
  #app.board .opt.on{ background:var(--accentSoft); }
  .opt .check{ float:right; margin-left:10px; color:var(--primary); font-weight:700; }
  .opt.primary-opt{ border-width:2px; border-color:var(--primary); box-shadow:0 2px 10px rgba(181,83,60,.12); }

  /* ---------- images ---------- */
  .imgwrap{ position:relative; overflow:hidden; background:var(--sunken); flex-shrink:0; }
  .imgwrap.hero{ height:230px; width:100%; }
  .imgwrap img{ width:100%; height:100%; object-fit:cover; display:block; position:relative; z-index:2; }
  .imgwrap img.broken{ display:none; }
  .ph{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .ph svg{ width:26px; height:26px; opacity:.65; }
  .ph em{ font-style:normal; font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  #app.board .imgwrap .ph{ filter:brightness(.5) saturate(.55); }

  /* ---------- recipe cards ---------- */
  .hscroll{ display:flex; gap:11px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .hscroll::-webkit-scrollbar{ display:none; }
  .gcard{
    flex:0 0 152px; background:var(--surface); border:1px solid var(--line); border-radius:15px;
    overflow:hidden; cursor:pointer; box-shadow:var(--shadow); text-align:left; padding:0; font-family:inherit; color:inherit;
  }
  .gcard .imgwrap{ height:104px; }
  .gcard .meta{ padding:9px 10px 11px; }
  .gcard .name{ font-family:var(--fontDisplay); font-size:14.5px; font-weight:600; color:var(--title); margin:0 0 3px; line-height:1.25; }
  .gcard .sub{ font-size:11px; color:var(--muted); margin:0; }

  .rcard{
    display:flex; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:15px; overflow:hidden; cursor:pointer; padding:0; font-family:inherit; color:inherit;
    box-shadow:var(--shadow);
  }
  .rcard+.rcard{ margin-top:9px; }
  .rcard .imgwrap{ width:96px; align-self:stretch; min-height:96px; }
  .rcard .meta{ padding:11px 12px 11px 0; flex:1; min-width:0; }
  .rcard .name{ font-family:var(--fontDisplay); font-size:16px; font-weight:600; color:var(--title); margin:0 0 3px; line-height:1.25; }
  .rcard .sub{ font-size:12px; color:var(--muted); margin:0 0 7px; }
  .rcard .tags{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .rcard .sel{
    width:24px; height:24px; border-radius:8px; border:2px solid var(--line); flex-shrink:0;
    align-self:center; margin-left:2px; display:flex; align-items:center; justify-content:center;
  }
  .rcard .sel.on{ background:var(--primary); border-color:var(--primary); color:var(--primaryInk); }
  .rcard .sel svg{ width:14px; height:14px; }

  /* ---------- 3-up card grid (Box groups, Station browse/search) ---------- */
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:2px; }
  .vcard{
    display:flex; flex-direction:column; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:13px; overflow:hidden; cursor:pointer; padding:0; font-family:inherit; color:inherit; position:relative;
    box-shadow:var(--shadow);
  }
  .vcard .imgwrap{ width:100%; aspect-ratio:1/1; }
  .vcard .meta{ padding:7px 8px 9px; }
  .vcard .name{
    font-family:var(--fontDisplay); font-size:12px; font-weight:600; color:var(--title); margin:0 0 3px; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .vcard .sub{ font-size:10px; color:var(--muted); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vcard .sub2{ font-size:9.5px; color:var(--muted); margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vcard .likeline, .vcard .addline, .vcard .colline, .vcard .globeline{ display:flex; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:700; color:var(--muted); min-width:22px; min-height:22px; }
  .vcard .likeline svg, .vcard .addline svg, .vcard .colline svg, .vcard .globeline svg{ width:13px; height:13px; }
  .vcard .likeline.on{ color:var(--primary); }
  .vcard .addline.on{ color:var(--ok); }
  .vcard .colline.on{ color:var(--primary); }
  .vcard .globeline{ color:var(--text); }
  .vcard .actrow{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .vcard .vbadge{
    position:absolute; top:6px; left:6px; z-index:3; width:21px; height:21px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:#fff; background:rgba(20,18,15,.45);
  }
  .vcard .vbadge svg{ width:11px; height:11px; }
  .vcard .vbadge.global{ background:var(--ok); }
  .vcard .vbadge.shared{ background:var(--warn); }
  .vcard .selchk{
    position:absolute; top:6px; right:6px; z-index:3; width:22px; height:22px; border-radius:7px;
    border:2px solid rgba(255,255,255,.85); background:rgba(20,18,15,.4); display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .vcard .selchk.on{ background:var(--primary); border-color:var(--primary); }
  .vcard .selchk svg{ width:12px; height:12px; }
  /* ---------- Browse rails (Trending / Popular) — hscroll container (the established horizontal-rail
     pattern, formerly on the old Dashboard, now also used in My Box's "for you today" strip) populated with
     the richer vcard component (image+like+owner), not the plainer gcard, since a rail item here needs the
     like-count line. The "From cooks you follow" rail was removed this pass along with Follow entirely. ---------- */
  .hscroll .vcard{ flex:0 0 130px; width:130px; }

  .grouphead{
    display:flex; align-items:center; gap:9px; width:100%; background:var(--surface2); border:1px solid var(--line);
    border-radius:13px; padding:11px 13px; cursor:pointer; margin:16px 0 9px; font-family:inherit; color:inherit;
  }
  .grouphead .gname{ flex:1; text-align:left; font-size:14px; font-weight:700; color:var(--title); letter-spacing:.01em; }
  .grouphead .gcount{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .grouphead .caret{ transition:transform .18s ease; color:var(--muted); display:flex; }
  .grouphead .caret svg{ width:15px; height:15px; }
  .grouphead.closed .caret{ transform:rotate(-90deg); }

  .likebtn{
    display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:999px; padding:6px 11px; font-size:12px; font-weight:650; cursor:pointer;
    min-height:34px;
  }
  .likebtn svg{ width:14px; height:14px; }
  .likebtn.on{ color:var(--primary); border-color:var(--primary); background:var(--accentSoft); }
  .likebtn.locked{ opacity:.55; }

  /* ---------- empty / info ---------- */
  .empty{
    border:1.5px dashed var(--line); border-radius:16px; padding:26px 20px; text-align:center; background:var(--surface);
  }
  .empty h3{ font-family:var(--fontDisplay); font-size:18px; font-weight:600; color:var(--title); margin:0 0 6px; }
  .empty p{ font-size:13px; color:var(--muted); line-height:1.5; margin:0 0 14px; }
  .empty.hero{ padding:32px 20px 28px; background:var(--title); border:0; }
  .empty.hero h3{ color:#FFFCF5; font-size:22px; }
  .empty.hero p{ color:rgba(255,252,245,.78); }
  .empty.hero .btn.hero{
    background:#FFFCF5; color:var(--title); min-height:54px; font-size:16px; box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .empty.hero a.linkish{ color:#F3E7C4; font-weight:650; font-size:14px; text-decoration:underline; text-underline-offset:3px; }
  .banner{
    border-radius:14px; padding:12px 14px; font-size:12.5px; line-height:1.5;
    background:var(--accentSoft); color:var(--text); border:1px solid var(--line);
  }
  .banner b{ color:var(--title); }
  .banner.ok{ background:var(--okSoft); border-color:transparent; }
  .banner.alert{ background:#F7E6E0; border-color:transparent; color:#7C3320; }
  #app.board .banner.alert{ background:#3A2822; color:#F0B7A5; }
  .switchline{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px dashed var(--line);
    border-radius:13px; padding:10px 12px; font-size:12.5px; color:var(--muted); line-height:1.4;
  }
  .switchline button{ flex-shrink:0; }
  .settingrow{
    display:flex; align-items:flex-start; gap:14px; padding:11px 0;
  }
  .settingrow + .settingrow{ border-top:1px solid var(--line); }
  .settingrow .slabel{ font-size:14.5px; font-weight:650; color:var(--title); }
  .settingrow .sexp{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .sw{
    flex-shrink:0; width:54px; height:30px; border-radius:999px; border:0; padding:0;
    background:var(--surface2); position:relative; cursor:pointer; margin-top:2px;
  }
  .sw i{
    position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.18); transition:left .16s ease;
  }
  .sw.on{ background:var(--ok); }
  .sw.on i{ left:27px; }
  .sw .swtxt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:750; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); pointer-events:none;
  }
  .sw.on .swtxt{ color:transparent; }

  /* ---------- lists ---------- */
  .ing{ display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .ing:last-child{ border-bottom:0; }
  .ing .amt{ color:var(--muted); font-size:12.5px; white-space:nowrap; padding-top:2px; }
  .ing.swapped .item{ color:var(--primary); font-weight:650; }
  .ing .was{ font-size:11.5px; color:var(--muted); font-weight:400; }
  ol.method{
    margin:0; padding:0 0 0 28px; list-style:decimal;
  }
  ol.method li{
    margin:0 0 16px; padding-left:6px; font-size:14.5px; line-height:1.55;
    overflow-wrap:anywhere;
  }
  ol.method li::marker{ color:var(--accent); font-weight:700; }

  .swapopt{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:1px solid var(--line);
    background:var(--surface); border-radius:13px; padding:12px; cursor:pointer; font-family:inherit; color:inherit;
  }
  .swapopt+.swapopt{ margin-top:8px; }
  .swapopt.on{ border-color:var(--primary); background:var(--accentSoft); }
  .swapopt .sbody{ flex:1; min-width:0; }
  .swapopt b{ font-size:14px; font-weight:650; color:var(--title); }
  .swapopt .why{ display:block; font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .swapopt .mark{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .swapopt.on .mark{ background:var(--primary); border-color:var(--primary); color:var(--primaryInk); }
  .swapopt .mark svg{ width:12px; height:12px; }

  .checkrow{
    display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line);
    cursor:pointer; width:100%; text-align:left; background:transparent; border-left:0; border-right:0; border-top:0;
    font-family:inherit; color:inherit;
  }
  .checkrow .box{
    width:23px; height:23px; border-radius:7px; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .checkrow.on .box{ background:var(--ok); border-color:var(--ok); color:var(--sunken); }
  .checkrow .box svg{ width:13px; height:13px; }
  .checkrow .iname{ font-size:15px; font-weight:550; }
  .checkrow .iamt{ font-size:13px; font-weight:600; color:var(--title); white-space:nowrap; padding-left:10px; flex-shrink:0; }
  .checkrow .ifrom{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .checkrow.on .iname{ text-decoration:line-through; color:var(--muted); font-weight:400; }
  .checkrow.on .iamt{ color:var(--muted); font-weight:500; }

  /* ---------- plan / board specifics ---------- */
  .day{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:15px;
    padding:13px; align-items:flex-start;
  }
  .day+.day{ margin-top:9px; }
  .day .dow{
    width:52px; flex-shrink:0; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); padding-top:3px; line-height:1.25; text-align:right;
  }
  .day .slotlab{ font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  .day .dname{ font-size:16px; font-weight:650; margin:2px 0 3px; color:var(--title); line-height:1.25; }
  .day .dsub{ font-size:11.5px; color:var(--muted); }
  .day.unfilled{ border-style:dashed; }
  .ritual{ display:flex; gap:6px; margin-top:8px; align-items:center; }
  .ritual .mark{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center;
    padding:0; cursor:pointer;
  }
  .ritual .mark svg{ width:15px; height:15px; }
  .ritual .mark.on{ border-color:var(--ok); color:var(--ok); background:var(--accentSoft); }
  .ritual .mark.love.on{ border-color:#c45b6a; color:#c45b6a; background:rgba(196,91,106,.12); }

  .bucket{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:13px; padding:10px 11px;
  }
  .bucket+.bucket{ margin-top:8px; }
  .bucket .kind{ font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); }
  .bucket .lab{ font-size:14.5px; font-weight:650; color:var(--title); margin-top:1px; }
  .bucket .x{ width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .bucket .x svg{ width:13px; height:13px; }

  .progressbar{ height:6px; border-radius:4px; background:var(--surface2); overflow:hidden; }
  .progressbar i{ display:block; height:100%; background:var(--ok); border-radius:4px; transition:width .25s ease; }

  /* ---------- sheets, toast, overlays ---------- */
  .sheetbg{
    position:absolute; inset:0; background:rgba(16,18,16,.5); z-index:30; display:none;
    align-items:flex-end; backdrop-filter:blur(2px);
  }
  .sheetbg.on{ display:flex; animation:fade .18s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .sheet{
    width:100%; max-height:88%; overflow-y:auto; background:var(--bg); color:var(--text);
    border-radius:20px 20px 0 0; padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));
    animation:up .22s cubic-bezier(.2,.8,.3,1); border-top:1px solid var(--line);
  }
  @keyframes up{ from{ transform:translateY(18px); opacity:.6 } to{ transform:none; opacity:1 } }
  .grab{ width:38px; height:4px; border-radius:4px; background:var(--line); margin:2px auto 14px; }
  .sheet h3{ font-family:var(--fontDisplay); font-size:20px; font-weight:600; color:var(--title); margin:0 0 6px; }

  .toast{
    position:absolute; left:16px; right:16px; bottom:126px; z-index:40;
    background:var(--title); color:var(--bg); padding:13px 15px; border-radius:13px;
    font-size:13px; line-height:1.45; display:none; box-shadow:0 10px 26px rgba(0,0,0,.28);
  }
  #app.board .toast{ background:var(--surface2); color:var(--text); border:1px solid var(--line); }
  .toast.on{ display:block; animation:up .2s ease; }

  .spinner{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent);
    animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px;
  }
  .spinner.big{ width:34px; height:34px; border-width:3px; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .skel{ background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%); background-size:200% 100%; animation:sh 1.2s linear infinite; border-radius:12px; }
  @keyframes sh{ to{ background-position:-200% 0 } }

  .hidden{ display:none !important; }
  .center{ text-align:center; }
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--pill); color:var(--pillInk);
    display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:700; flex-shrink:0;
  }

  /* onboarding / auth full-bleed */
  .pane{ min-height:100%; display:flex; flex-direction:column; padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px)); }
  .pane .top{ flex:1; }
  .brand{ font-family:var(--fontDisplay); font-size:31px; font-weight:600; color:var(--title); letter-spacing:-.03em; margin:0 0 8px; }
  .stepdots{ display:flex; gap:5px; margin-bottom:22px; }
  .stepdots i{ height:3px; flex:1; border-radius:3px; background:var(--line); }
  .stepdots i.on{ background:var(--primary); }
  .logo{
    width:52px; height:52px; border-radius:15px; background:var(--title); color:var(--bg);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  }
  .logo svg{ width:27px; height:27px; }

  /* ---------- taste graph — free-floating physics dish picker (ported mechanism, see 00-Handoff.md) ----------
     Full-screen overlay, sibling of #sheetBg/#toast so re-renders of #main never touch it. No rendered
     connections/edges ever — the "graph" feel comes entirely from soft mutual repulsion + jitter + damping run
     every animation frame (see tickDishGraph()), never from drawn lines. Reusable from onboarding AND from
     Profile & Settings ("Retune what I like") via openTasteGraph(mode). */
  .taste-layer{
    position:absolute; inset:0; z-index:34; background:var(--bg); color:var(--text);
    display:none; flex-direction:column;
  }
  .taste-layer.on{ display:flex; animation:fade .18s ease; }
  .taste-bar{
    flex-shrink:0; padding:16px 16px 12px; display:flex; align-items:flex-start; gap:10px;
    border-bottom:1px solid var(--line); background:var(--surface);
  }
  .taste-bar h2{ font-family:var(--fontDisplay); font-size:19px; font-weight:600; color:var(--title); margin:0 0 4px; letter-spacing:-.01em; }
  .taste-bar p{ margin:0; font-size:12px; color:var(--muted); line-height:1.45; }
  .taste-canvas{ flex:1; position:relative; overflow:hidden; background:var(--sunken); }
  .tnode{
    position:absolute; width:78px; margin-left:-39px; margin-top:-39px;
    display:flex; flex-direction:column; align-items:center; cursor:pointer;
    transition:opacity .42s ease, transform .42s ease;
    will-change:left, top, opacity, transform;
    background:transparent; border:0; padding:0; font-family:inherit; color:inherit;
  }
  .tnode .orb{
    width:66px; height:66px; border-radius:50%; overflow:hidden;
    background:var(--surface); border:1.5px solid var(--line);
    box-shadow:0 6px 16px rgba(0,0,0,.16);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--fontDisplay); font-size:20px; font-weight:600;
  }
  .tnode .orb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tnode .lbl{
    margin-top:6px; font-size:10.5px; font-weight:600; text-align:center; color:var(--text);
    line-height:1.2; max-width:90px;
  }
  .tnode:active .orb{ transform:scale(.93); }
  .tnode.gone{ opacity:0; transform:scale(.5); pointer-events:none; }
  .tnode.in{ animation:tnodeIn .45s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes tnodeIn{ from{ opacity:0; transform:scale(.5); } to{ opacity:1; transform:scale(1); } }
  /* "picked" — weak or neutral tier (Fix 1): a dish has been tapped but its family hasn't resolved/pruned yet.
     Distinct filled/glowing state, deliberately NOT the same visual as .gone (still fully interactive/tappable
     to deselect) — consistent with the dark taste-layer aesthetic's existing accent tokens, no new colors. */
  .tnode.picked .orb{ border-color:var(--primary); border-width:2.5px; box-shadow:0 0 0 4px var(--accentSoft), 0 6px 16px rgba(0,0,0,.16); }
  .tnode.picked .lbl{ color:var(--primary); font-weight:700; }
  .taste-readout{ flex-shrink:0; padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--surface); }
  .taste-readout .tiny b{ color:var(--title); }
  .taste-bar .stepdots{ margin-bottom:10px; }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <button class="iconbtn plain" id="hdrLeft" onclick="hdrLeftAction()"></button>
    <div class="grow" style="min-width:0">
      <h1 class="htitle" id="hdrTitle">Recipe Box</h1>
      <p class="hsub hidden" id="hdrSub"></p>
    </div>
    <div class="row" id="hdrRight" style="gap:6px"></div>
  </header>
  <main id="main"></main>
  <button class="fab hidden" id="fab" onclick="openCaptureFrom(state.screen)" aria-label="Capture a recipe"></button>
  <nav id="nav"></nav>
  <div class="sheetbg" id="sheetBg" onclick="if(event.target===this) closeSheet()">
    <div class="sheet" id="sheet"></div>
  </div>
  <!-- Taste graph overlay — sibling of #main, never touched by rerender()/showScreen()'s #main.innerHTML swap,
       so the physics loop and its DOM nodes survive state re-renders elsewhere in the app while open. Reusable
       from onboarding and from Profile & Settings via openTasteGraph('onboarding'|'retune'). -->
  <div class="taste-layer" id="tasteLayer">
    <div class="taste-bar">
      <!-- Onboarding back-nav fix (2026-08-16) — the overlay is full-bleed over the whole #app, including the
           header, so the header's own back button is unreachable while this is open. This is onboarding's
           equivalent back affordance, shown only in mode==='onboarding' (retune, from Profile & Settings, has no
           "back" concept — Done just closes it). Empty/hidden by default; populated in openTasteGraph(). -->
      <button class="iconbtn plain hidden" id="tasteBarBack" onclick="backFromTasteGraph()" aria-label="Back"></button>
      <div class="grow">
        <div id="tasteBarSteps" class="hidden"></div>
        <h2>What do you actually cook?</h2>
        <p>Tap a dish that sounds like you. Weak taps just mark it — a family only fades out once you've confirmed it.</p>
      </div>
      <button class="btn ghost sm" id="tasteBarDone" onclick="closeTasteGraph()">Done</button>
    </div>
    <div class="taste-canvas" id="tasteCanvas"></div>
    <div class="taste-readout" id="tasteReadout"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ============================================================
   0. ICONS
   ============================================================ */
const ICONS = {
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>',
  radio:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4"/>',
  cart:'<path d="M4 5h2l2.2 10.2a2 2 0 0 0 2 1.6h6.7a2 2 0 0 0 2-1.5L21 8H7"/><circle cx="10.5" cy="20" r="1.2"/><circle cx="17.5" cy="20" r="1.2"/>',
  user:'<circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  share:'<path d="M12 16V4M8.5 7.5L12 4l3.5 3.5"/><path d="M5 13v6.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V13"/>',
  heart:'<path d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8.4 3.9 3.9 0 0 1 19 10.8C19 15.6 12 20 12 20z"/>',
  swap:'<path d="M4 8h13l-3.2-3.2M20 16H7l3.2 3.2"/>',
  check:'<path d="M4.5 12.5l5 5 10-11"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  camera:'<path d="M4 8.5h3.3L9 6h6l1.7 2.5H20v11H4z"/><circle cx="12" cy="14" r="3.2"/>',
  link:'<path d="M10 13.5a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>',
  pen:'<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/>',

const CUISINE_TREE = [
  {name:'South Indian', children:['Chettinad','Andhra','Malabar']},
  {name:'North Indian', children:['Punjabi']},
  {name:'Chinese', children:['Szechuan','Cantonese']},

  {name:'Korean', children:[]}

const CUISINES = CUISINE_TREE.map(t=>t.name);
function cuisineParent(name){
  if(!name) return null;
  for(const t of CUISINE_TREE){
    if(t.name===name) return t.name;
    if(t.children.includes(name)) return t.name;
  }
  return name;
}
function cuisineMatches(recipeCuisine, selected){
  if(!selected) return true;
  if(recipeCuisine===selected) return true;
  const node = CUISINE_TREE.find(t=>t.name===selected);
  return !!(node && node.children.includes(recipeCuisine));
}
function cuisineTasteHit(recipeCuisine, tasteSet){
  if(!recipeCuisine || !tasteSet || !tasteSet.size) return false;
  if(tasteSet.has(recipeCuisine)) return true;
  const p = cuisineParent(recipeCuisine);
  return !!(p && p!==recipeCuisine && tasteSet.has(p));
}

/* ---- Pure facet-capture logic (zero DOM dependency — deliberately, so the self-test can exercise it directly
   in plain Node without jsdom; see the "Taste graph" screen-logic section below for the DOM-touching half). ---- */
function cookTimeBucket(mins){ return mins<20 ? 'quick' : mins<=40 ? 'weeknight' : 'weekend-project'; }
function emptySignal(){ return {cuisine:{}, ingredient:{}, health:{}, cookTime:{}, mealTag:{}, diet:{}}; }
function implicitTasteFromRecipe(r, weight){
  if(!r) return;
  const sig = state.profile.tasteSignals || (state.profile.tasteSignals = Object.assign(emptySignal(), {taps:0}));
  const w = weight==null ? 1 : weight;
  if(r.cuisine && (sig.cuisine[r.cuisine]||0) < 3) bump(sig.cuisine, r.cuisine, w);
  names(r).forEach(n => { const k=n.toLowerCase(); if((sig.ingredient[k]||0)<3) bump(sig.ingredient, k, w); });
  if(r.mins){ const b=cookTimeBucket(r.mins); if((sig.cookTime[b]||0)<3) bump(sig.cookTime, b, w); }
  if(r.healthy) bump(sig.health, 'healthy', w);
  (r.tags||[]).forEach(t => { if((sig.mealTag[t]||0)<3) bump(sig.mealTag, t, w); });
  sig.taps = (sig.taps||0) + 1;
}
/* `weight` defaults to 1 (unweighted bump, the pre-Fix-1 behavior) so any caller that doesn't care about tiers
   still works unchanged. Fix 1 passes an explicit weight per tier — see the TASTE_SIGNAL_* block below. Negative
   weights are used by the deselect path (tapDishNode) to reverse exactly what an earlier weak/neutral tap added. */
function bump(map, key, weight){ if(!key) return; map[key] = (map[key]||0) + (weight==null?1:weight); }
function dishFacets(d){
  return { cuisine:d.cuisine, ingredient:d.ingredientTags.slice(), health:d.health, cookTime:cookTimeBucket(d.mins), mealTag:d.mealTags.slice() };
}
/* Bumps every facet of every dish in `dishes` into `signal` (mutates + returns it), at `weight` per dish
   (defaults to 1). Called either with a single dish (a weak/neutral tap) or a whole family's group (a strong
   resolution — including members never shown on screen this session, so the family's full signal counts even
   for dishes the user never actually saw a tile for). */
function mergeFacets(signal, dishes, weight){
  const w = weight==null ? 1 : weight;
  dishes.forEach(d=>{
    const f = dishFacets(d);
    bump(signal.cuisine, f.cuisine, w);
    bump(signal.health, f.health, w);
    bump(signal.cookTime, f.cookTime, w);
    f.ingredient.forEach(t=>bump(signal.ingredient, t, w));
    f.mealTag.forEach(t=>bump(signal.mealTag, t, w));
  });
  return signal;
}
/* The core "what does a STRONG resolution absorb" computation, pure: every DISH_TILES member sharing `dishId`'s
   family that is still in `unusedIds` — on screen or not. `unusedIds` is a plain Set of ids, so this is trivially
   callable from a Node test harness with no DOM/state coupling at all. Only called at strong-tier resolution
   (see computeTapTier + tapDishNode below) — weak/neutral taps register only the single tapped dish's own facets. */
function computeTapGroup(dishId, unusedIds){
  const start = DISH_TILES.find(d=>d.id===dishId);
  if(!start) return [];
  return DISH_TILES.filter(d=>unusedIds.has(d.id) && d.family===start.family);
}

/* ---- Weak / Neutral / Strong signal tiers (Fix 1, 2026-08-16) ----
   Named, grouped, retunable constants — this block is the single place to change these thresholds/weights later,
   not magic numbers scattered through tapDishNode()/computeTapTier().
     TASTE_SIGNAL_NEUTRAL_TAPS / TASTE_SIGNAL_STRONG_TAPS — distinct-dish tap counts, within one family, at which
       a tap's tier promotes weak -> neutral -> strong. Strong is also reached early — before the literal 3rd tap
       exists — once every member of that family CURRENTLY ON THE BOARD has been individually tapped (the
       small-family case: a family with only 1-2 members represented can still reach strong).
     TASTE_SIGNAL_WEIGHT_WEAK/NEUTRAL/STRONG — facet-count weight bump()/mergeFacets() apply per tier.
   Weighting scheme: a weak tap registers ONLY the tapped dish's own facets, at WEIGHT_WEAK. A neutral tap
   registers ONLY the second tapped dish's own facets, at WEIGHT_NEUTRAL — additive on top of the first dish's
   weak contribution, nothing is rewritten or removed. A strong resolution registers the WHOLE family's facets
   (every still-unused DISH_TILES member of that family, on-screen or not — the pre-existing off-screen-
   absorption behavior, unchanged) at WEIGHT_STRONG, additive on top of whatever weak/neutral contributions were
   already registered for dishes tapped en route to strong. Net effect: a family that took the full 3 taps to
   confirm ends up weighted somewhat more heavily overall than one exhausted in fewer taps (small families) —
   deliberately: "the more you told us, the more sure we are."
   ONBOARD_TASTE_MIN_TAPS is a SEPARATE, pre-existing "enough signal before Continue" gate (moved in Fix 2 from
   continueProfile() to the taste step's own Continue action, but its threshold/behavior is unchanged) — kept as
   its own constant, distinct from TASTE_SIGNAL_STRONG_TAPS, even though both happen to be 3 right now, so
   retuning one can never accidentally retune the other. */
const TASTE_SIGNAL_NEUTRAL_TAPS   = 2;
const TASTE_SIGNAL_STRONG_TAPS    = 3;
const TASTE_SIGNAL_WEIGHT_WEAK    = 1;
const TASTE_SIGNAL_WEIGHT_NEUTRAL = 2;
const TASTE_SIGNAL_WEIGHT_STRONG  = 3;
const ONBOARD_TASTE_MIN_TAPS      = 3;

/* Pure tier-decision function for Fix 1 — given the dish being tapped, the Set of dish ids already "picked"
   (weak or neutral, not yet resolved) within that dish's family this session, and how many of that family's
   members are CURRENTLY on the board (needed for the small-family early-strong case), returns which tier this
   tap lands in. Zero DOM/state.tasteGraph coupling, deliberately — mirrors computeTapGroup()'s own
   pure-function precedent above, and is what the self-test's pure-logic harness exercises directly.
   tapDishNode() below is the thin DOM-touching wrapper around this + computeTapGroup(). */
function computeTapTier(dishId, familyPickedSet, onBoardCountForFamily){
  const dish = DISH_TILES.find(d=>d.id===dishId);
  if(!dish) return null;
  if(familyPickedSet.has(dishId)) return { tier:'deselect', dish };
  const pickedCount = familyPickedSet.size + 1; // this tap would be the (size+1)th distinct pick in the family
  if(pickedCount >= TASTE_SIGNAL_STRONG_TAPS || pickedCount >= onBoardCountForFamily){
    return { tier:'strong', dish, weight: TASTE_SIGNAL_WEIGHT_STRONG };
  }
  if(pickedCount >= TASTE_SIGNAL_NEUTRAL_TAPS){
    return { tier:'neutral', dish, weight: TASTE_SIGNAL_WEIGHT_NEUTRAL };
  }
  return { tier:'weak', dish, weight: TASTE_SIGNAL_WEIGHT_WEAK };
}

/* v>0 filter added for Fix 1: a deselected weak/neutral tap can zero out a facet count via mergeFacets' negative
   weight reversal; zeroed-out entries must never surface in the "Learned: ..." readout. */
function topEntries(map, n){ return Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>k); }
/* Renders the "Learned: X · Y · Z" line from any signal-shaped object carrying a `taps` count — reused
   verbatim by the live canvas readout, the onboarding summary card, and the Profile "Retune" summary card. */
function facetMark(map, key){
  const v = (map&&map[key])||0;
  return esc(key)+(v>=3?' (strong)':v>0?' (weak)':'');
}
function tasteReadoutHTML(signal){
  if(!signal || !signal.taps) return '<p class="tiny">A few taps. Once a cuisine or ingredient is strong we stop putting more of it on the board.</p>';
  const line = (label, map, n) => {
    const top = Object.entries(map||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,n);
    if(!top.length) return '';
    return '<div class="tiny" style="margin:2px 0"><b>'+label+'</b> '+top.map(([k,v])=>esc(k)+(v>=3?' (strong)':' (weak)')).join(' · ')+'</div>';
  };
  return line('Cuisine', signal.cuisine, 3)+line('Ingredients', signal.ingredient, 5)+line('Health', signal.health, 2)+line('Time', signal.cookTime, 2)+line('Also', signal.mealTag, 3);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  R({id:'cat-pasta-aglioolio', title:'Spaghetti Aglio e Olio', dish:'pasta', dishName:'Pasta', cuisine:'Italian',

            'Parsley right at the end. This is a five-ingredient dish — there is nowhere to hide a bad olive oil, so use a decent one.']}),

function findRecipe(id){

function ownedByYou(id){ return state.box.some(r=>r.id===id); }
/* A personal copy of something already in Browse cannot be published again.
   Your own original can go up once; after that the globe is gone. */
function cameFromCatalogue(r){
  if(!r || !r.forkedFrom) return false;
  const k = r.forkedFrom.kind;
  if(k==='browse' || k==='catalogue') return true;
  const src = r.forkedFrom.sourceId ? findRecipe(r.forkedFrom.sourceId) : null;
  if(!src) return false;
  if(src.visibility==='global') return true;
  if(state.catalogue.some(c=>c.id===src.id)) return true;
  return cameFromCatalogue(src);
}
function canPublishToBrowse(r){

}

/* ---- Serving-size scaling (Recipe Detail 1–5 stepper). Parses a leading numeric amount (integer, decimal,
   ascii fraction "1/2", unicode fraction "½", or a mixed number "1 1/2") off the front of a free-text amount
   string and scales it proportionally to the selected serving count against the recipe's base `servings`.
   Amounts with no parseable leading number (e.g. "salt to taste", "a handful of cilantro", "for greasing") are
   left completely unscaled and flagged — never guessed. ---- */
const UNICODE_FRACTIONS = {'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
function parseLeadingQty(amount){
  const s = (amount||'').trim();
  const m = s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?|[½⅓⅔¼¾⅛⅜⅝⅞])(\s*)(.*)$/);
  if(!m) return null;
  const qtyStr = m[1], rest = (m[3]||'').trim();
  let qty;
  if(UNICODE_FRACTIONS[qtyStr]!==undefined) qty = UNICODE_FRACTIONS[qtyStr];
  else if(qtyStr.indexOf(' ')>-1){
    const [whole, frac] = qtyStr.split(' ');
    const [n,d] = frac.split('/').map(Number);
    qty = Number(whole) + (d ? n/d : 0);
  } else if(qtyStr.indexOf('/')>-1){
    const [n,d] = qtyStr.split('/').map(Number);
    qty = d ? n/d : NaN;
  } else qty = parseFloat(qtyStr);
  if(isNaN(qty)) return null;
  return { qty, rest };
}
function formatQty(q){
  const rounded = Math.round(q*100)/100;
  if(Math.abs(rounded-Math.round(rounded))<0.01) return String(Math.round(rounded));
  const whole = Math.floor(rounded), frac = rounded-whole;
  const nice = [[0.125,'⅛'],[0.25,'¼'],[0.333,'⅓'],[0.375,'⅜'],[0.5,'½'],[0.625,'⅝'],[0.667,'⅔'],[0.75,'¾'],[0.875,'⅞']];
  for(const [v,sym] of nice){ if(Math.abs(frac-v)<0.06) return (whole>0?whole+' ':'')+sym; }
  return String(Math.round(rounded*100)/100);
}
/* returns {amount, unscaled} — unscaled:true means the original string is returned untouched (freeform) */
function scaledAmount(amount, baseServings, targetServings){
  const parsed = parseLeadingQty(amount);
  if(!parsed) return { amount, unscaled: true };
  if(targetServings===baseServings) return { amount, unscaled: false };
  const scaledQty = parsed.qty * (targetServings/baseServings);
  return { amount: formatQty(scaledQty) + (parsed.rest ? ' '+parsed.rest : ''), unscaled: false };
}

/* targetServings defaults to the recipe's own base servings (i.e. no scaling) when not given — used by ad hoc
   shopping-list builds and anywhere else a serving count isn't otherwise contextual. */
function cookScaleCaption(r, current){
  const base = r.servings || 4;
  return 'Written for '+base+'. Showing '+current+' '+(current===1?'person':'people')+' — this is just for cooking now, not saved.';
}
function scaledIngLines(r, current){
  return '<div class="card pad">'+effectiveIngredients(r, current).map(i=>
    '<div class="ing"><span class="item">'+esc(i.item)+(i.swapped?' <span class="tiny">swapped</span>':'')+'</span><span class="amt">'+esc(i.amount)+(i.unscaled && current!==(r.servings||4)?' <em class="tiny">doesn\'t scale</em>':'')+'</span></div>'
  ).join('')+'</div>';
}
function effectiveIngredients(r, targetServings){
  const base = r.servings || 4;
  const target = targetServings || base;
  return r.ingredients.map(i=>{
    const swapped = i.swappedTo;
    const sc = scaledAmount(i.amount, base, target);
    return { orig: i.item, item: swapped ? swapped : i.item, amount: sc.amount, unscaled: sc.unscaled,
      swapped: !!swapped, why: i.swapWhy||'' };
  });
}
function matchesBoxFilter(r){
  const f = state.boxFilter;
  if(f==='all') return true;
  if(f==='quick') return r.mins<=25;
  if(f.startsWith('diet:')) return r.dietTags.includes(f.slice(5));
  return true;
}
function hasLiked(id){ return state.likes.has(id); }
function likeCountOf(r){ return r.likeCount + (hasLiked(r.id) ? 0 : 0); }

/* ---- Bias-aware engagement score (Solution-Sketch delta #10, Part 2, 2026-08-16) ----
   PLACEHOLDER, EXPLICITLY NOT FINAL — Solution-Sketch's own wording defers the exact weighting/algorithm to
   architecture/tuning against real alpha usage data ("stated plainly as needing empirical calibration, same
   posture as delta pass #8's confidence-cutoff, not a guessed-at formula dressed up as validated"). This is one
   reasonable, clearly-commented formula that satisfies the sketch's hard *requirements* — not the final answer.

   Requirements this formula must satisfy (from Solution-Sketch, restated):
     1. Cumulative in-app counters (like_count, box_add_count) alone must never be the sole sort key.
     2. External signal must be able to make a low-in-app-engagement recipe rank competitively, not buried.
     3. New items need a baseline-exposure floor so early movers can't permanently bury a fresh recipe at zero.

   Formula:
     inApp    = boxAddCount*2 + likeCount
       — box_add_count weighted 2x likeCount: an adoption (someone forked it into their own Box) is a stronger
         signal than a like, matching Solution-Sketch's own framing of box_add_count as the stronger "did they
         actually take it" signal vs. a lighter-weight like.
     external = ratingPart + ratingCountPart + engagementPart
       ratingPart        = (externalRatingValue/5) * 40           — scaled to a 0-40 range
       ratingCountPart   = min(log10(externalRatingCount+1)*8, 25) — log-damped so 10,000 reviews isn't
                                                                      1,000x "louder" than 10, capped at 25
       engagementPart    = min(log10(externalEngagementCount+1)*8, 30) — same log-damping/cap, capped at 30
       — deliberately log-damped and capped: a single viral video's raw view count would otherwise
         mathematically flatten every in-app signal in the catalogue to irrelevance, which is the exact
         rich-get-richer failure mode this feature exists to counteract, just inverted.
     newItemFloor = addedDaysAgo<14 ? (14-addedDaysAgo)*1.5 : 0
       — every recipe under 14 days old gets a small, linearly-decaying flat floor so a brand-new recipe with
         literally zero counters of any kind (no likes, no adds, no external signal) still clears total
         obscurity rather than scoring a hard zero, satisfying requirement 3 independent of requirement 2.
     score = inApp + external + newItemFloor
   All three inputs (`externalRatingValue`, `externalRatingCount`, `externalEngagementCount`) are read raw and
   separate per the locked data model — this function is the one place they get combined, and only into a
   ranking score, never written back as a stored "blended" field (Solution-Sketch explicitly rejects that). */
function engagementScore(r){
  const inApp = (r.boxAddCount||0)*2 + (r.likeCount||0);
  const ratingPart = r.externalRatingValue ? (r.externalRatingValue/5)*40 : 0;
  const ratingCountPart = r.externalRatingCount ? Math.min(Math.log10(r.externalRatingCount+1)*8, 25) : 0;
  const engagementPart = r.externalEngagementCount ? Math.min(Math.log10(r.externalEngagementCount+1)*8, 30) : 0;
  const external = ratingPart + ratingCountPart + engagementPart;
  const newItemFloor = (r.addedDaysAgo!=null && r.addedDaysAgo<14) ? (14-r.addedDaysAgo)*1.5 : 0;
  return inApp + external + newItemFloor;
}

/* dish-grouping for Station search — "Sambar — 3 versions". Versions within each group are ranked by
   engagementScore() (bias-aware), not raw like_count/box_add_count — so a just-captured, high-external-signal
   version (e.g. cat-pavbhaji-sanjyot) can surface ahead of an established one within its own dish group, same
   requirement applied at the whole-catalogue level in popularList()/stationCandidates() below. */
function groupByDish(list){
  const g = {};
  list.forEach(r=>{ const k=r.dish||r.id; (g[k]=g[k]||{name:r.dishName||r.title, items:[]}).items.push(r); });
  Object.values(g).forEach(group=>group.items.sort((a,b)=>engagementScore(b)-engagementScore(a)));
  return Object.values(g);
}

/* ---- Collections (owner-scoped, many-to-many via RecipeCollection, never shared, no nesting) ---- */
function collectionsOf(recipeId){
  return state.recipeCollections.filter(rc=>rc.recipeId===recipeId)

function ownedCopyOf(id){
  if(ownedByYou(id)) return findRecipe(id);

function recipeInAnyCollection(recipeId){

/* Collections are personal. A Browse tap forks a private copy first, then opens the picker. */
function ensurePersonalCopy(id){
  const existing = ownedCopyOf(id);
  if(existing) return existing;
  const src = findRecipe(id);
  if(!src) return null;
  const fork = forkRecipe(src, {kind:'browse', label:'the catalogue, by '+src.owner, sourceId:src.id}, 'private');
  implicitTasteFromRecipe(src, 1);
  src.boxAddCount = (src.boxAddCount||0) + 1;
  state.box.unshift(fork);
  return fork;
}
function quickAddToCollection(id){
  const copy = ensurePersonalCopy(id);

}
function recipesInCollection(collectionId){
  const ids = new Set(state.recipeCollections.filter(rc=>rc.collectionId===collectionId).map(rc=>rc.recipeId));
  return state.box.filter(r=>ids.has(r.id));
}
function findOrCreateCollection(name){
  name = name.trim();
  let c = state.collections.find(c=>c.name.toLowerCase()===name.toLowerCase());
  if(!c){ c = {id:'col'+Date.now(), name, createdAt:Date.now(), updatedAt:Date.now()}; state.collections.push(c); }
  return c;
}
function addRecipeToCollection(recipeId, collectionId){
  if(state.recipeCollections.some(rc=>rc.recipeId===recipeId && rc.collectionId===collectionId)) return;
  state.recipeCollections.push({recipeId, collectionId, addedAt:Date.now()});
}
function removeRecipeFromCollection(recipeId, collectionId){
  state.recipeCollections = state.recipeCollections.filter(rc=>!(rc.recipeId===recipeId && rc.collectionId===collectionId));
}

  if(!el) return;

}

   6. SHOPPING LIST — strictly derived, full rebuild, no drift
   ============================================================ */
function addShopLine(map, i, title){
  const key = (i.item||'').toLowerCase();
  const parsed = parseLeadingQty(i.amount);
  if(!map[key]){
    map[key] = {
      name: i.item,
      from: new Set([title]),
      qty: parsed ? parsed.qty : null,
      unit: parsed ? (parsed.rest||'') : null,
      extras: parsed ? [] : [i.amount]
    };
    return;
  }
  const it = map[key];
  it.from.add(title);
  if(parsed && it.qty!=null && (parsed.rest||'').toLowerCase()===(it.unit||'').toLowerCase()){
    it.qty += parsed.qty;
    return;
  }
  const line = i.amount;
  if(line && it.extras.indexOf(line)<0) it.extras.push(line);
}
function shopAmountLabel(it){
  const bits = [];
  if(it.qty!=null) bits.push(formatQty(it.qty)+(it.unit ? ' '+it.unit : ''));
  (it.extras||[]).forEach(e=>{ if(e) bits.push(e); });
  return bits.join(' + ');
}
function finalizeShopItems(map, prevChecked){
  return Object.values(map).map(it=>({
    name: it.name,
    amount: shopAmountLabel(it),
    from: [...it.from],
    checked: !!(prevChecked && prevChecked[it.name])
  })).sort((a,b)=>a.name.localeCompare(b.name));
}
/* Aisle is inferred at list time from the ingredient name. Recipes stay untagged — this is a shop walk, not a pantry model. */
const SHOP_AISLE_DEFS = [
  ['herbs', 'Herbs & aromatics', ['coriander leaves','cilantro','mint','basil','curry leaves','parsley','dill','thyme','rosemary','oregano','kaffir','lemongrass','ginger','garlic','green chilli','dried red chilli','red chilli','shallot','spring onion','scallion']],
  ['oils', 'Oils & fats', ['coconut oil','olive oil','gingelly oil','sesame oil','oil']],
  ['spices', 'Spices & condiments', ['cumin','turmeric','coriander powder','chilli powder','garam masala','sambar powder','biryani masala','rajma masala','mustard seeds','black pepper','peppercorn','saffron','bay leaf','cardamom','cinnamon','clove','fennel','fenugreek','asafoetida','tamarind','soy','gochujang','vinegar','salt','sugar','honey','jaggery']],
  ['produce', 'Produce', ['onion','tomato','potato','carrot','green beans','spinach','beetroot','cucumber','avocado','lime','lemon','cabbage','cauliflower','broccoli','capsicum','bell pepper','drumstick','corn','mango','banana','pumpkin','zucchini','aubergine','eggplant','mushroom','lettuce','kale','peas','radish','methi','fenugreek leaves','grated coconut','coconut']],
  ['dairy', 'Dairy & eggs', ['milk','curd','yogurt','yoghurt','cream','paneer','cheese','parmesan','feta','ghee','butter','egg']],
  ['protein', 'Meat & seafood', ['chicken','mutton','lamb','beef','pork','bacon','fish','prawn','shrimp','seafood']],
  ['dry', 'Pulses, grains & bread', ['dal','kidney beans','black beans','beans','rajma','chickpea','chana','lentil','rice','basmati','quinoa','oats','pasta','noodle','flour','atta','batter','tortilla','bread','idli']]
];
function shopAisle(name){
  const n = (name||'').toLowerCase();
  for(let i=0;i<SHOP_AISLE_DEFS.length;i++){
    const [id, label, kws] = SHOP_AISLE_DEFS[i];
    if(kws.some(k=>n.includes(k))) return {id, label};
  }
  return {id:'other', label:'Other'};
}
function groupShopItems(items){
  const order = ['produce','herbs','dairy','protein','dry','spices','oils','other'];
  const labels = {produce:'Produce', herbs:'Herbs & aromatics', dairy:'Dairy & eggs', protein:'Meat & seafood', dry:'Pulses, grains & bread', spices:'Spices & condiments', oils:'Oils & fats', other:'Other'};
  const g = {};
  (items||[]).forEach(it=>{
    const a = shopAisle(it.name);
    (g[a.id]=g[a.id]||[]).push(it);
  });
  return order.filter(id=>g[id]&&g[id].length).map(id=>({id, label:labels[id], items:g[id]}));
}
function shopItemRow(it){
  return '<button class="checkrow '+(it.checked?'on':'')+'" onclick="toggleShopItem(\''+esc(it.name).replace(/'/g,"\\'")+'\')"><span class="box">'+(it.checked?ico('check'):'')+'</span>'+
    '<span class="grow"><span class="iname">'+esc(it.name)+'</span><div class="ifrom">'+esc(it.from.slice(0,2).join(', '))+(it.from.length>2?' +'+(it.from.length-2):'')+'</div></span>'+
    (it.amount?'<span class="iamt">'+esc(it.amount)+'</span>':'')+'</button>';
}
function rebuildShoppingListFromPlan(){
  if(!state.plan) return;

function buildAdHocShoppingList(ids){
  const people = state.profile.householdSize || state.gen.headcount || 2;
  const map = {};

/* ============================================================
   7. FLEXIBLE SKELETON — expand buckets, cycle/truncate to meal_count
   ============================================================ */
function cloneSlots(src){
  return (src||[]).map(b=>({id:b.id, facetType:b.facetType, facetValue:b.facetValue, count:b.count, collectionId:b.collectionId||null}));
}
function shapeMealCount(){
  return slotBag('week').reduce((s,b)=>s+b.count,0);
}
function ensureWeekSlots(){
  if(!state.weekSlots) state.weekSlots = cloneSlots(state.slots);
  return state.weekSlots;
}
function slotBag(kind){
  return kind==='week' ? ensureWeekSlots() : state.slots;
}
function expandSlots(){
  const out = [];
  ensureWeekSlots().forEach(b=>{ for(let i=0;i<b.count;i++) out.push({facetType:b.facetType, facetValue:b.facetValue}); });
  return out;
}
function mealSlotLabel(i){
  return 'Meal '+(i+1);
}
function slotsToMealCount(){
  return expandSlots();
}
function collectionForSlot(slot){
  if(slot.collectionId){
    const byId = state.collections.find(c=>c.id===slot.collectionId);
    if(byId) return byId;
  }
  const v = (slot.facetValue||'').toLowerCase();
  return state.collections.find(c=>c.name.toLowerCase()===v) || null;
}
function recipeInCollection(recipeId, collectionId){
  return state.recipeCollections.some(rc=>rc.recipeId===recipeId && rc.collectionId===collectionId);
}
function matchesNamedFacet(r, slot){
  const v = (slot.facetValue||'').toLowerCase();
  if(slot.facetType==='cuisine') return cuisineMatches(r.cuisine, slot.facetValue);
  if(slot.facetType==='tag') return v==='quick' ? r.mins<=25 : (r.tags||[]).some(t=>String(t).toLowerCase()===v);
  if(slot.facetType==='ingredient') return names(r).some(n=>n.toLowerCase().includes(v));
  if(slot.facetType==='collection'){
    const col = collectionForSlot(slot);
    return !!(col && recipeInCollection(r.id, col.id));
  }
  return false;
}
function surpriseCuisineSet(){
  const s = new Set();
  (state.profile.cuisinesLiked||[]).forEach(c=>s.add(c));
  return s;
}
function matchesSurprise(r){
  const allowed = surpriseCuisineSet();
  if(allowed.size && !cuisineTasteHit(r.cuisine, allowed)) return false;
  const named = ensureWeekSlots().filter(b=>b.facetType!=='surprise');
  if(named.some(b=>matchesNamedFacet(r,b))) return false;
  return true;
}
function matchesFacet(r, slot){
  if(slot.facetType==='surprise') return matchesSurprise(r);
  return matchesNamedFacet(r, slot);
}
function overlapCount(r, haveNames){ return names(r).filter(n=>haveNames.has(n)).length; }
function cookScore(recipeId){
  let s = 0;
  (state.cookLog||[]).forEach(e=>{
    if(e.recipeId!==recipeId) return;
    if(e.response==='again') s += 3;
    else if(e.response==='yes') s += 2;
    else if(e.response==='skip') s -= 3;
  });
  return s;
}
function swapAwayCount(recipeId){
  let n = 0;
  const plans = [];
  if(state.plan) plans.push(state.plan);
  (state.planHistory||[]).forEach(p=>plans.push(p));
  plans.forEach(p=>(p.days||[]).forEach(d=>{ if(d.swappedFromRecipeId===recipeId) n++; }));
  return n;
}
function mostCookedReadout(){
  const map = {};
  (state.cookLog||[]).forEach(e=>{
    if(e.response==='skip' || !e.recipeId) return;
    map[e.recipeId] = (map[e.recipeId]||0) + (e.response==='again'?2:1);
  });
  const top = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,n])=>{
    const r = findRecipe(id);
    return r ? esc(r.title)+' × '+n : null;
  }).filter(Boolean);
  if(!top.length) return '';
  return '<label class="field">Most cooked</label><p class="helper" style="margin-top:0">'+top.join(' · ')+' — from days you marked cooked or loved. Skips are not guessed.</p>';
}
function rankCandidates(cands, slot, haveNames){
  const surprise = slot.facetType==='surprise';
  return cands.slice().sort((a,b)=>{
    const skipA = cookScore(a.id)<0 ? 1 : 0;
    const skipB = cookScore(b.id)<0 ? 1 : 0;
    if(skipA!==skipB) return skipA-skipB;
    if(surprise){
      return 0;
    }
    if(state.gen.saveOnGroceries && haveNames.size){
      const o = overlapCount(b,haveNames)-overlapCount(a,haveNames);
      if(o) return o;
    }
    const sa = cookScore(a.id) - swapAwayCount(a.id);
    const sb = cookScore(b.id) - swapAwayCount(b.id);
    return sb-sa;
  });
}

/* hard dietary restrictions — always enforced, every intent, every mode, never relaxed (Solution-Sketch delta #3) */
const RESTRICTION_KEYWORDS = {
  'gluten-free': ['pasta','noodles','tortillas','couscous','ragi flour','rice flour'],
  'nut-free': ['walnut','cashew','almond','peanut','pine nut','melon seeds'],
  'dairy-free': ['paneer','cream','butter','cheese','ghee','milk','curd','parmesan','feta'],
  'no onion/garlic': ['onion','garlic','shallot'],
  'low oil': []
};
function violatesRestriction(r, restriction){
  if(r.dietTags.includes(restriction)) return false;   // recipe explicitly declares compliance
  const kws = RESTRICTION_KEYWORDS[restriction] || [];
  if(!kws.length) return false;
  return names(r).some(n => { const nl = n.toLowerCase(); return kws.some(k => nl.includes(k)); });
}
const MEAT_KWS = ['chicken','beef','pork','lamb','mutton','bacon','fish','prawn','shrimp','seafood','egg'];
const LAND_MEAT = ['chicken','beef','pork','lamb','mutton','bacon'];
function recipeLooksAnimal(r){
  const bag = names(r).join(' ').toLowerCase()+' '+(r.dietTags||[]).join(' ');
  return MEAT_KWS.some(k => bag.includes(k));
}
function recipeLooksLandMeat(r){
  const bag = names(r).join(' ').toLowerCase();
  return LAND_MEAT.some(k => bag.includes(k));
}
function dietStanceAllows(r){
  const s = state.profile.dietStance;
  if(!s || !s.size) return true;
  if(s.has('non_vegetarian')) return true; // inclusive — still eats veg
  if(s.has('vegan')){
    const bag = names(r).join(' ').toLowerCase();
    if(recipeLooksAnimal(r)) return false;
    if(['paneer','ghee','cream','butter','cheese','milk','curd','yogurt'].some(k=>bag.includes(k)) && !(r.dietTags||[]).includes('vegan')) return false;
  }
  if(s.has('vegetarian') && !s.has('eggetarian') && !s.has('pescatarian') && recipeLooksLandMeat(r)) return false;
  if(s.has('pescatarian') && recipeLooksLandMeat(r)) return false;
  return true;
}

/* ============================================================
   8. GENERATE — synchronous slot-fill, intent-weighted, recency-excluded, defaults-first (this pass — no gate)
   ============================================================ */
/* Syncs the headcount default from Profile.householdSize the first time the generate screen is shown, unless
   the user has already opened Adjust and touched a control (genTouched) — after that, their choice wins on
   every subsequent regenerate, this session. */
function syncGenDefaultsFromHousehold(){
  if(state.genTouched) return;
  state.gen.headcount = state.profile.householdSize || 2;
}
function planIsCommitted(){ return !!(state.plan && state.plan.committed); }
function archiveCurrentPlan(){
  if(!state.plan || !state.plan.committed) return;
  const snap = {
    id:'ph'+Date.now(),
    archivedAt: Date.now(),
    generationIntent: state.plan.generationIntent,
    headcount: state.plan.headcount,
    mealCount: state.plan.mealCount,
    mixInBrowse: state.plan.mixInBrowse,
    days: (state.plan.days||[]).map(d=>({
      dayIndex:d.dayIndex, dow:d.dow, facetType:d.facetType, facetValue:d.facetValue,
      recipeId:d.recipeId, swappedFromRecipeId:d.swappedFromRecipeId, ritual:d.ritual
    }))
  };
  state.planHistory = state.planHistory || [];
  state.planHistory.unshift(snap);
  if(state.planHistory.length>8) state.planHistory.length = 8;
}
function runGenerate(){
  ensureWeekSlots();
  if(!state.weekSlots.length){ toast('Add at least one bucket to this week\'s shape first.'); return; }
  if(planIsCommitted()) archiveCurrentPlan();
  if(state.shoppingList && state.shoppingList.linkedToPlan) state.shoppingList = null;
  const slotList = slotsToMealCount();
  const mealCount = slotList.length;
  /* Always sourced from the user's own Box by default — never auto-mixing in unverified global-catalogue
     recipes. "Mix in a few Browse picks" (Adjust panel) is the only opt-in path to widen the pool. */
  let pool = state.box.slice();
  if(state.gen.mixInBrowse) pool = pool.concat(stationBaseGlobal().filter(r=>!ownedByYou(r.id)));
  const dietOk = r => ![...state.profile.restrictions].some(res => violatesRestriction(r, res)) && dietStanceAllows(r);
  const usedIds = new Set();
  const haveNames = new Set();
  const days = slotList.map((slot,i)=>{
    let cands = pool.filter(r=>!usedIds.has(r.id) && !state.recentlyCookedIds.has(r.id) && matchesFacet(r,slot) && dietOk(r));
    cands = rankCandidates(cands, slot, haveNames);
    const chosen = cands[0] || null;
    if(chosen){ usedIds.add(chosen.id); names(chosen).forEach(n=>haveNames.add(n)); }
    return { dayIndex:i, dow: mealSlotLabel(i),
      facetType:slot.facetType, facetValue:slot.facetValue, recipeId: chosen?chosen.id:null,
      swappedFromRecipeId:null, ritual:null };
  });
  const headcount = state.gen.headcount;
  /* share:null — Plan-share fix (2026-08-16). A fresh/regenerated plan starts with no active share link; opening
     the "Share this plan" panel lazily creates one via ensurePlanShareToken() the first time it's needed,
     mirroring PlanShare being its own row keyed off this specific plan instance. */
  state.plan = { generationIntent: state.gen.saveOnGroceries ? 'save_on_groceries' : 'balanced', headcount,
    mealCount, mixInBrowse: state.gen.mixInBrowse, saveOnGroceries: state.gen.saveOnGroceries, days, share: null, committed: false };
  const missing = days.filter(d=>!d.recipeId).length;
  showScreen('scr-plan');
  toast(missing ? 'Week generated — '+missing+' slot'+(missing>1?'s':'')+' still need a matching recipe.' : 'Week generated from your recipes'+(state.gen.mixInBrowse?', mixing in a few Browse picks.':'.'));
}

/* ============================================================
